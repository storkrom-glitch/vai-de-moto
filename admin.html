<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#FFB300"/>
<title>VAI DE MOTO — Painel do Administrador</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:#0B0F14;color:#E6EDF3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
  .topo{position:fixed;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(11,15,20,.97);border-bottom:1px solid rgba(255,179,0,.35);z-index:50}
  .logo{font-size:15px;font-weight:900}
  .logo span{color:#FFB300}
  .chip{font-size:11px;color:#FFB300;background:rgba(255,179,0,.1);border:1px solid rgba(255,179,0,.4);padding:5px 10px;border-radius:999px}
  .wrap{max-width:1200px;margin:0 auto;padding:66px 14px 30px}
  .card{background:#10161D;border:1px solid #1F2937;border-radius:14px;padding:16px;margin-bottom:12px}
  .lbl{font-size:10px;color:#8B98A5;text-transform:uppercase;letter-spacing:.8px;margin:0 0 5px;font-weight:700}
  .inp{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #2A3542;background:#0D1218;color:#E6EDF3;font-size:14px;outline:none;font-family:inherit}
  .inp:focus{border-color:#FFB300}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 14px;border-radius:10px;border:none;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;color:#fff;text-decoration:none}
  .btn:active{transform:scale(.98)}
  .btn.amber{background:linear-gradient(135deg,#FFB300,#FF8F00);color:#1a1408}
  .btn.green{background:linear-gradient(135deg,#00E676,#00B25A);color:#04140B}
  .btn.blue{background:linear-gradient(135deg,#3B82F6,#2563EB)}
  .btn.red{background:linear-gradient(135deg,#EF4444,#DC2626)}
  .btn.ghost{background:transparent;border:1px solid #2A3542;color:#9CA3AF}
  .btn.mini{min-height:32px;padding:0 10px;font-size:11px;border-radius:8px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tab{padding:9px 14px;border-radius:10px;border:1px solid #2A3542;background:transparent;color:#9CA3AF;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit}
  .tab.on{background:rgba(255,179,0,.12);border-color:#FFB300;color:#FFB300}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
  .stat{background:#10161D;border:1px solid #1F2937;border-radius:12px;padding:12px}
  .stat .n{font-size:22px;font-weight:900}
  .stat .l{font-size:10px;color:#8B98A5;text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-top:2px}
  .item{background:#10161D;border:1px solid #1F2937;border-radius:12px;padding:12px;margin-bottom:10px}
  .item.travada{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.05)}
  .item .head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
  .item .nome{font-weight:800;font-size:14px}
  .item .sub{font-size:11px;color:#9CA3AF;margin-top:2px;word-wrap:break-word}
  .badge{padding:3px 9px;border-radius:999px;font-size:10px;font-weight:800;border:1px solid}
  .b-ok{color:#00E676;border-color:rgba(0,230,118,.4);background:rgba(0,230,118,.1)}
  .b-blq{color:#EF4444;border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.1)}
  .b-ab{color:#FACC15;border-color:rgba(250,204,21,.4);background:rgba(250,204,21,.1)}
  .b-ac{color:#3B82F6;border-color:rgba(59,130,246,.4);background:rgba(59,130,246,.1)}
  .b-rota{color:#00E676;border-color:rgba(0,230,118,.4);background:rgba(0,230,118,.1)}
  .b-fim{color:#9CA3AF;border-color:rgba(156,163,175,.4);background:rgba(156,163,175,.1)}
  .b-trav{color:#EF4444;border-color:rgba(239,68,68,.6);background:rgba(239,68,68,.15);animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{color:#8B98A5;text-transform:uppercase;font-size:10px;letter-spacing:.6px;text-align:left;padding:8px 6px;border-bottom:1px solid #1F2937}
  td{padding:8px 6px;border-bottom:1px dashed rgba(255,255,255,.06);vertical-align:top}
  #mapaVivo{height:600px;border-radius:14px;overflow:hidden;background:#0E1A24;border:1px solid #1F2937;margin-bottom:12px;position:relative}
  #mapaLegenda{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:#9CA3AF;margin-top:8px}
  #mapaLegenda span{display:inline-flex;align-items:center;gap:5px}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#FFB300;color:#1a1408;font-weight:800;font-size:12px;padding:11px 18px;border-radius:999px;opacity:0;transition:opacity .3s;z-index:9999;max-width:90vw;text-align:center;pointer-events:none}
  #toast.show{opacity:1}
  #toast.err{background:#EF4444;color:#fff}
  .mapa-info{background:#0D1218;border:1px solid #1F2937;border-radius:10px;padding:10px;font-size:12px;max-width:260px}
  .mapa-info b{color:#FFB300}
  .mapa-info .btn{margin-top:8px;width:100%}
  .mapa-controles{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .ponto-item{display:flex;align-items:center;gap:10px;padding:10px;background:#0D1218;border:1px solid #1F2937;border-radius:10px;margin-bottom:8px}
  .ponto-cor{width:14px;height:14px;border-radius:50%;flex-shrink:0}
  .ponto-info{flex:1;min-width:0}
  .ponto-info b{font-size:13px}
  .ponto-info small{color:#8B98A5;font-size:10px;display:block;margin-top:2px}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}
  .modal{background:#10161D;border:1px solid #FFB300;border-radius:14px;padding:20px;max-width:420px;width:100%}
  .modal h3{margin-bottom:14px;color:#FFB300}
  .modal .btn{margin-top:10px}
  .cores-opcoes{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .cor-opcao{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent}
  .cor-opcao.sel{border-color:#fff;box-shadow:0 0 0 2px #FFB300}
  .icones-opcoes{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .icone-opcao{width:40px;height:40px;border-radius:8px;background:#0D1218;border:2px solid #2A3542;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
  .icone-opcao.sel{border-color:#FFB300;background:rgba(255,179,0,.15)}
  .mapa-status{position:absolute;top:10px;right:10px;background:rgba(0,230,118,.9);color:#000;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700;z-index:1000;pointer-events:none}
  .aba-conteudo{display:none}
  .aba-conteudo.ativa{display:block}
  .alerta-travada{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.4);border-radius:12px;padding:12px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
  .alerta-travada .ico{font-size:24px}
  .alerta-travada .txt{flex:1}
  .alerta-travada .txt b{color:#EF4444}
  .alerta-travada .txt small{color:#9CA3AF;display:block;margin-top:2px}
  .busca-box{display:flex;gap:8px;align-items:center}
  .busca-box .inp{flex:1}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topo">
  <div class="logo">🏍️ VAI DE <span>MOTO</span> • 👑 ADMIN</div>
  <div class="chip" id="adminchip" style="display:none"></div>
</div>

<div class="wrap" id="app"></div>

<div id="painel" style="display:none">
  <div class="wrap">
    <div class="tabs">
      <button class="tab on" data-aba="dash" onclick="mudarAba('dash')">📊 Visão geral</button>
      <button class="tab" data-aba="mapa" onclick="mudarAba('mapa')">🗺️ Mapa ao vivo</button>
      <button class="tab" data-aba="pontos" onclick="mudarAba('pontos')">📌 Pontos (<span id="cntPontos">0</span>)</button>
      <button class="tab" data-aba="testes" onclick="mudarAba('testes')">🧪 Corrida de Teste</button>
      <button class="tab" data-aba="pass" onclick="mudarAba('pass')">🙋 Passageiros (<span id="cntPass">0</span>)</button>
      <button class="tab" data-aba="moto" onclick="mudarAba('moto')">🏍️ Motoqueiros (<span id="cntMoto">0</span>)</button>
      <button class="tab" data-aba="cor" onclick="mudarAba('cor')"> Corridas & Relatórios</button>
      <button class="tab" data-aba="adm" onclick="mudarAba('adm')">️ Admins</button>
      <button class="tab" onclick="sairAdmin()">🚪 Sair</button>
    </div>

    <div id="aba-dash" class="aba-conteudo ativa"></div>
    <div id="aba-mapa" class="aba-conteudo">
      <div class="stats" id="statsMapa"></div>
      <div id="alertasTravadas"></div>
      <div class="mapa-controles">
        <button class="btn blue" id="btnAddPonto" onclick="toggleModoPonto()">📌 Adicionar ponto de interesse</button>
        <button class="btn ghost" onclick="centralizarMapa()">🎯 Centralizar tudo</button>
        <button class="btn ghost" onclick="forcarAtualizacaoMapa()">🔄 Atualizar agora</button>
      </div>
      <div id="mapaVivo">
        <div class="mapa-status" id="mapaStatus" style="display:none">🟢 Atualizado</div>
      </div>
      <div id="mapaLegenda">
        <span>🟢 Motoqueiro online</span>
        <span>🔵 Motoqueiro em corrida</span>
        <span> Origem do pedido</span>
        <span>🏁 Destino do pedido</span>
        <span>📌 Ponto de interesse</span>
      </div>
    </div>
    <div id="aba-pontos" class="aba-conteudo"></div>
    <div id="aba-testes" class="aba-conteudo"></div>
    <div id="aba-pass" class="aba-conteudo"></div>
    <div id="aba-moto" class="aba-conteudo"></div>
    <div id="aba-cor" class="aba-conteudo"></div>
    <div id="aba-adm" class="aba-conteudo"></div>
  </div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script>
const FB = window.VDM.firebaseURL;
const KEY_ADMIN = 'vdm_admin';
const TEMPO_MAX_SEM_GPS_MIN = 30;

let sessao = null;
let abaAtual = 'dash';
let P = {}, M = {}, C = {}, POS = {}, PONTOS = {};
let buscaP = '', buscaM = '';
let filtroStatus = 'todas', filtroPeriodo = '30';
let editando = null;
let pollTimer = null;

// 🎯 Estado do formulário de teste (preservado entre renderizações)
let estadoTeste = {
  motoId: '',
  passNome: 'Cliente Teste Admin',
  passTel: '00000000000',
  origem: 'Local de Teste - Origem',
  destino: 'Local de Teste - Destino',
  valor: '15.00'
};

let mapa = null;
let mapaInicializado = false;
let marcadoresMapa = {};
let modoAdicionarPonto = false;
let cliqueTemp = null;
let primeiraCargaMapa = true;

const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return'h'+h.toString(36);}
const brl = v => 'R$ ' + (parseFloat(v)||0).toFixed(2).replace('.',',');
const dataFmt = iso => iso ? new Date(iso).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'}) : '—';
const dataHoraFmt = iso => iso ? new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
const tempoAtras = iso => {
  if(!iso) return '—';
  const min = Math.floor((Date.now() - new Date(iso).getTime())/60000);
  if(min < 1) return 'agora';
  if(min < 60) return 'há '+min+' min';
  const h = Math.floor(min/60);
  return 'há '+h+'h'+(min%60>0?(min%60):'');
};

function toast(msg,err){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (err?' err':'');
  setTimeout(()=>t.className='', 3000);
}

async function api(caminho, method, body){
  const opts = { method, headers:{'Content-Type':'application/json'} };
  if(body) opts.body = JSON.stringify(body);
  const r = await fetch(FB + caminho, opts);
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return await r.json();
}

function salvarSessao(u){ sessao=u; localStorage.setItem(KEY_ADMIN, JSON.stringify(u)); }
function carregarSessao(){ try{ return JSON.parse(localStorage.getItem(KEY_ADMIN)); }catch(e){ return null; } }

const ST = {
  aberta:    { lbl:'ABERTA',      cls:'b-ab'  },
  aceita:    { lbl:'ACEITA',      cls:'b-ac'  },
  em_rota:   { lbl:'EM ROTA',     cls:'b-rota'},
  concluida: { lbl:'CONCLUÍDA',   cls:'b-fim' },
  cancelada: { lbl:'CANCELADA',   cls:'b-blq' }
};
const badgeSt = s => { const x = ST[s]||ST.aberta; return `<span class="badge ${x.cls}">${x.lbl}</span>`; };

async function renderLogin(){
  document.getElementById('painel').style.display = 'none';
  const app = document.getElementById('app');
  let admins = null;
  try{ admins = await api('/admins.json','GET'); }catch(e){}
  const primeiro = !admins || Object.keys(admins).length === 0;

  if(primeiro){
    app.innerHTML = '<div class="card" style="max-width:420px;margin:30px auto"><div style="text-align:center;margin-bottom:14px"><div style="font-size:38px">👑</div><b style="font-size:16px">Primeiro acesso do Administrador</b><p style="font-size:11px;color:#8B98A5;margin-top:4px">Crie seu usuário mestre do VAI DE MOTO</p></div><div class="lbl">Seu nome</div><input class="inp" id="aNome" placeholder="Ex: Washington" style="margin-bottom:10px"/><div class="lbl">Usuário de login</div><input class="inp" id="aUser" placeholder="ex: admin" style="margin-bottom:10px"/><div class="lbl">Senha (mín. 6)</div><input class="inp" id="aSenha" type="password" placeholder="••••••" style="margin-bottom:14px"/><button class="btn amber" style="width:100%" onclick="criarAdmin()">👑 Criar acesso de administrador</button></div>';
    return;
  }
  app.innerHTML = '<div class="card" style="max-width:420px;margin:30px auto"><div style="text-align:center;margin-bottom:14px"><div style="font-size:38px">🔐</div><b style="font-size:16px">Painel do Administrador</b></div><div class="lbl">Usuário</div><input class="inp" id="lUser" placeholder="admin" style="margin-bottom:10px"/><div class="lbl">Senha</div><input class="inp" id="lSenha" type="password" placeholder="••••••" style="margin-bottom:14px"/><button class="btn amber" style="width:100%" onclick="logarAdmin()">Entrar no painel</button></div>';
}

window.criarAdmin = async () => {
  const nome = (document.getElementById('aNome').value||'').trim();
  const user = (document.getElementById('aUser').value||'').trim().toLowerCase();
  const senha = document.getElementById('aSenha').value||'';
  if(!nome || !user){ toast('Preencha nome e usuário.',true); return; }
  if(senha.length < 6){ toast('Senha mín. 6 caracteres.',true); return; }
  const id = 'adm-' + Date.now();
  await api('/admins/'+id+'.json','PUT',{ id, nome, usuario:user, senhaHash:hash(senha), criadoEm:new Date().toISOString() });
  salvarSessao({ id, nome, usuario:user });
  toast('👑 Admin criado! Bem-vindo.');
  mostrarPainel();
};

window.logarAdmin = async () => {
  const user = (document.getElementById('lUser').value||'').trim().toLowerCase();
  const senha = document.getElementById('lSenha').value||'';
  const admins = await api('/admins.json','GET') || {};
  const achado = Object.values(admins).find(a => a && a.usuario === user);
  if(!achado){ toast('Usuário não encontrado.',true); return; }
  if(achado.senhaHash !== hash(senha)){ toast('Senha incorreta.',true); return; }
  salvarSessao({ id:achado.id, nome:achado.nome, usuario:achado.usuario });
  toast('👑 Bem-vindo, '+achado.nome+'!');
  mostrarPainel();
};

window.sairAdmin = () => {
  localStorage.removeItem(KEY_ADMIN);
  sessao=null;
  if(pollTimer){ clearInterval(pollTimer); pollTimer=null; }
  document.getElementById('painel').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  renderLogin();
};

function mostrarPainel(){
  document.getElementById('app').style.display = 'none';
  document.getElementById('painel').style.display = 'block';
  const chip = document.getElementById('adminchip');
  if(sessao){ chip.style.display='block'; chip.textContent='👑 '+sessao.nome; }
  
  if(!mapaInicializado){
    setTimeout(()=>{
      try{
        mapa = L.map('mapaVivo',{zoomControl:true,zoomSnap:0.5,zoomDelta:0.5,wheelPxPerZoomLevel:120}).setView([-22.9,-43.2], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(mapa);
        mapaInicializado = true;
        setupCliqueMapa();
        mapa.on('zoomend moveend', ()=>{
          const status = document.getElementById('mapaStatus');
          if(status){ status.style.display = 'block'; setTimeout(()=>{ status.style.display = 'none'; }, 2000); }
        });
      }catch(e){ console.error('Erro ao inicializar mapa:', e); toast('Erro ao carregar mapa: '+e.message, true); }
    }, 300);
  }
  
  renderTodasAbas();
  
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async ()=>{
    await loadAll();
    if(sessao && !editando){
      // 🎯 Não re-renderiza a aba de testes para preservar o formulário
      renderTodasAbas(true);
      if(abaAtual==='mapa' && mapaInicializado){ sincronizarMapa(); }
    }
  }, 8000);
}

async function loadAll(){
  try{
    const [p,m,c,pos,pontos] = await Promise.all([
      api('/passageiros.json','GET'),
      api('/motoqueiros.json','GET'),
      api('/corridas.json','GET'),
      api('/posicoes.json','GET'),
      api('/pontos_interesse.json','GET')
    ]);
    P = p||{}; M = m||{}; C = c||{}; POS = pos||{}; PONTOS = pontos||{};
  }catch(e){}
}

function listaCorridas(){ return Object.entries(C).map(([id,c])=>({id,...c})); }
function listaPass(){ return Object.entries(P).map(([id,p])=>({id,...p})); }
function listaMoto(){ return Object.entries(M).map(([id,m])=>({id,...m})); }
function listaPontos(){ return Object.entries(PONTOS).map(([id,p])=>({id,...p})); }

function corridasDoPeriodo(){
  const agora = new Date(); const h0 = new Date(agora.getFullYear(),agora.getMonth(),agora.getDate());
  let inicio = null;
  if(filtroPeriodo==='1') inicio = h0;
  if(filtroPeriodo==='7') inicio = new Date(h0.getTime()-6*86400000);
  if(filtroPeriodo==='30') inicio = new Date(h0.getTime()-29*86400000);
  return listaCorridas().filter(c=>{
    const d = new Date(c.criadaEm||0);
    if(inicio && d < inicio) return false;
    if(filtroStatus!=='todas' && c.status!==filtroStatus) return false;
    return true;
  });
}

function detectarCorridasTravadas(){
  const agora = Date.now();
  const travadas = [];
  listaCorridas().forEach(c=>{
    if(c.status !== 'aceita' && c.status !== 'em_rota') return;
    const pos = POS[c.id];
    if(!pos || !pos.ts){
      const idadeMin = (agora - new Date(c.criadaEm||0).getTime())/60000;
      if(idadeMin > TEMPO_MAX_SEM_GPS_MIN){ travadas.push({corrida:c, motivo:'Sem GPS desde o início', tempoMin: Math.floor(idadeMin)}); }
      return;
    }
    const idadePosMin = (agora - new Date(pos.ts).getTime())/60000;
    if(idadePosMin > TEMPO_MAX_SEM_GPS_MIN){ travadas.push({corrida:c, motivo:'Último GPS há '+Math.floor(idadePosMin)+' min', tempoMin: Math.floor(idadePosMin)}); }
  });
  return travadas;
}

window.mudarAba = (aba) => {
  abaAtual = aba;
  document.querySelectorAll('.tab').forEach(t => { t.classList.toggle('on', t.dataset.aba === aba); });
  document.querySelectorAll('.aba-conteudo').forEach(el => { el.classList.remove('ativa'); });
  const abaEl = document.getElementById('aba-'+aba);
  if(abaEl) abaEl.classList.add('ativa');
  
  if(aba === 'mapa' && mapaInicializado){
    setTimeout(()=>{ mapa.invalidateSize(); sincronizarMapa(); }, 100);
  }
};

function renderTodasAbas(preservarTeste = false){
  document.getElementById('cntPontos').textContent = listaPontos().length;
  document.getElementById('cntPass').textContent = listaPass().length;
  document.getElementById('cntMoto').textContent = listaMoto().length;
  
  renderDash();
  renderMapaStats();
  renderAlertasTravadas();
  renderPontos();
  if(!preservarTeste) renderTestes(); else atualizarContadoresTeste();
  renderPass();
  renderMoto();
  renderCor();
  renderAdm();
}

function atualizarContadoresTeste(){
  // Apenas atualiza os contadores, não re-renderiza o formulário

function renderDash(){
  const el = document.getElementById('aba-dash');
  if(!el) return;
  const cs = listaCorridas();
  const concl = cs.filter(c=>c.status==='concluida');
  const fatur = concl.reduce((t,c)=>t+(parseFloat(c.valorAceito)||0),0);
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const conclHoje = concl.filter(c=>new Date(c.concluidaEm||c.criadaEm||0) >= hoje);
  const fatHoje = conclHoje.reduce((t,c)=>t+(parseFloat(c.valorAceito)||0),0);
  const bloqueados = listaPass().filter(p=>p.bloqueado).length + listaMoto().filter(m=>m.bloqueado).length;
  const abertas = cs.filter(c=>c.status==='aberta').length;
  const travadas = detectarCorridasTravadas();

ze:12px;flex-wrap:wrap"><span><b>#'+esc(c.id.slice(-6))+'</b> • '+esc(c.passageiroNome||'?')+' → '+esc(c.destEndereco||'').slice(0,28)+'</span><span>'+badgeSt(c.status)+' <b style="color:#00E676">'+(c.valorAceito?brl(c.valorAceito):'')+'</b> <span style="color:#6B7280">'+dataHoraFmt(c.criadaEm)+'</span></span></div>').join('') || '<p style="color:#6B7280;font-size:12px">Nenhuma corrida ainda.</p>')+'</div>';

  el.innerHTML = '<div class="alerta-travada"><div class="ico">🚨</div><div class="txt"><b>'+travadas.length+' corrida(s) sem movimento há +'+TEMPO_MAX_SEM_GPS_MIN+' min</b><small>Motoqueiro pode ter travado. Use os botões abaixo para resolver.</small></div></div>'+travadas.map(t=>'<div class="item travada"><div class="head"><div><div class="nome">🚨 #'+esc(t.corrida.id.slice(-6))+' <span class="badge b-trav">TRAVADA</span> '+badgeSt(t.corrida.status)+'</div><div class="sub">🏍️ '+esc(t.corrida.motoqueiroNome||'—')+' • 🙋 '+esc(t.corrida.passageiroNome||'—')+'<br/>⚠️ '+t.motivo+' •  '+brl(t.corrida.valorAceito||0)+'</div></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn green mini" onclick="forcarConclusao(\''+t.corrida.id+'\')">✅ Forçar conclusão</button><button class="btn red mini" onclick="abrirModalCancelar(\''+t.corrida.id+'\')">❌ Cancelar</button></div></div></div>').join('');

window.centralizarMapa = () => {
  if(!mapa) return;
  const pontos = [];
  listaCorridas().forEach(c=>{ if(c.origLat) pontos.push([c.origLat,c.origLng]); if(c.destLat) pontos.push([c.destLat,c.destLng]); });
  Object.values(POS).forEach(p=>{ if(p.lat) pontos.push([p.lat,p.lng]); });
  listaPontos().forEach(p=>{ if(p.lat) pontos.push([p.lat,p.lng]); });
  if(pontos.length > 0){ try{ mapa.fitBounds(L.latLngBounds(pontos),{padding:[40,40],maxZoom:14}); }catch(e){} }
};

window.forcarAtualizacaoMapa = async () => {
  toast('🔄 Atualizando...');
  await loadAll();
  sincronizarMapa();
  renderTodasAbas();
  toast('✅ Mapa atualizado!');
};

function setupCliqueMapa(){
  if(!mapa) return;
  mapa.off('click');
  mapa.on('click', (e) => {
    if(!modoAdicionarPonto) return;
    cliqueTemp = { lat: e.latlng.lat, lng: e.latlng.lng };
    abrirModalPonto();
  });
}

function abrirModalPonto(){
  if(!cliqueTemp) return;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = '<div class="modal"><h3>📌 Novo Ponto de Interesse</h3><div class="lbl">Nome do local *</div><input class="inp" id="pontoNome" placeholder="Ex: Hospital São Lucas" style="margin-bottom:10px"/><div class="lbl">Observação (opcional)</div><input class="inp" id="pontoObs" placeholder="Ex: Entrada principal" style="margin-bottom:10px"/><div class="lbl">Cor do marcador</div><div class="cores-opcoes"><div class="cor-opcao sel" data-cor="#EF4444" style="background:#EF4444"></div><div class="cor-opcao" data-cor="#3B82F6" style="background:#3B82F6"></div><div class="cor-opcao" data-cor="#00E676" style="background:#00E676"></div><div class="cor-opcao" data-cor="#FACC15" style="background:#FACC15"></div><div class="cor-opcao" data-cor="#A855F7" style="background:#A855F7"></div><div class="cor-opcao" data-cor="#EC4899" style="background:#EC4899"></div></div><div class="lbl">Ícone</div><div class="icones-opcoes"><div class="icone-opcao sel" data-icone="📍">📍</div><div class="icone-opcao" data-icone="🏥">🏥</div><div class="icone-opcao" data-icone="🏫">🏫</div><div class="icone-opcao" data-icone="🏪"></div><div class="icone-opcao" data-icone="⛽">⛽</div><div class="icone-opcao" data-icone="🚔">🚔</div><div class="icone-opcao" data-icone="">🏁</div><div class="icone-opcao" data-icone="⭐">⭐</div></div><button class="btn green" style="width:100%" onclick="salvarPonto()">💾 Salvar ponto</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="fecharModalPonto()">Cancelar</button></div>';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) fecharModalPonto(); });
  overlay.querySelectorAll('.cor-opcao').forEach(el => { el.addEventListener('click', () => { overlay.querySelectorAll('.cor-opcao').forEach(x => x.classList.remove('sel')); el.classList.add('sel'); }); });
  overlay.querySelectorAll('.icone-opcao').forEach(el => { el.addEventListener('click', () => { overlay.querySelectorAll('.icone-opcao').forEach(x => x.classList.remove('sel')); el.classList.add('sel'); }); });
}

window.fecharModalPonto = () => { const overlay = document.querySelector('.modal-overlay'); if(overlay) overlay.remove(); cliqueTemp = null; };

window.salvarPonto = async () => {
  const nome = (document.getElementById('pontoNome').value||'').trim();
  if(!nome){ toast('Informe o nome do local.',true); return; }
  const obs = (document.getElementById('pontoObs').value||'').trim();
  const cor = document.querySelector('.cor-opcao.sel')?.dataset.cor || '#EF4444';
  const icone = document.querySelector('.icone-opcao.sel')?.dataset.icone || '';
  const id = 'ponto-' + Date.now();
  const ponto = { id, nome, obs, cor, icone, lat: cliqueTemp.lat, lng: cliqueTemp.lng, criadoEm: new Date().toISOString(), criadoPor: sessao.nome };
  try{
    await api('/pontos_interesse/'+id+'.json','PUT', ponto);
    toast(' Ponto salvo!');
    fecharModalPonto();
    modoAdicionarPonto = false;
    await loadAll();
    sincronizarMapa();
    renderTodasAbas();
  }catch(e){ toast('Erro: '+e.message,true); }
};

window.excluirPonto = async (id) => {
  if(!confirm('Excluir este ponto de interesse?')) return;
  try{ await api('/pontos_interesse/'+id+'.json','DELETE'); toast('🗑️ Ponto excluído.'); await loadAll(); sincronizarMapa(); renderTodasAbas(); }catch(e){ toast('Erro: '+e.message,true); }
};

function sincronizarMapa(){
  if(!mapa || !mapaInicializado) return;
  const cs = listaCorridas();
  const pontosAtuais = new Set();
  const travadasIds = new Set(detectarCorridasTravadas().map(t=>t.corrida.id));

  cs.filter(c=>c.status==='aberta').forEach(c=>{
    if(c.origLat && c.origLng){
      const key = 'aberta-'+c.id;
      pontosAtuais.add(key);
      const html = '<div style="background:#FACC15;color:#000;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5)">📍</div>';
      const tooltip = '📡 #'+c.id.slice(-6)+' • '+(c.passageiroNome||'—')+'\n📍 '+(c.origEndereco||'')+'\n🏁 '+(c.destEndereco||'')+'\n '+(c.distanciaKm||'—')+' km';
      const popup = '<div class="mapa-info"><b>📡 PEDIDO ABERTO</b><br/><b>#'+esc(c.id.slice(-6))+'</b> • '+badgeSt(c.status)+'<br/>🙋 '+esc(c.passageiroNome||'—')+'<br/>📞 '+esc(c.passageiroTel||'—')+'<br/>📍 '+esc(c.origEndereco||'').slice(0,50)+'<br/>🏁 '+esc(c.destEndereco||'').slice(0,50)+'<br/>📏 '+(c.distanciaKm||'—')+' km<br/>🕐 '+tempoAtras(c.criadaEm)+'<br/><button class="btn red mini" onclick="cancelarDoMapa(\''+c.id+'\')">🗑️ Cancelar/Apagar pedido</button></div>';
      atualizarOuCriarMarcador(key, [c.origLat,c.origLng], html, tooltip, popup);
    }
    if(c.destLat && c.destLng){
      const key = 'dest-'+c.id;
      pontosAtuais.add(key);
      const html = '<div style="background:#EF4444;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5)"></div>';
      const tooltip = '🏁 Destino #'+c.id.slice(-6)+'\n'+(c.destEndereco||'');
      const popup = '<div class="mapa-info"><b>🏁 DESTINO</b><br/><b>#'+esc(c.id.slice(-6))+'</b><br/>'+esc(c.destEndereco||'').slice(0,60)+'<br/><button class="btn red mini" onclick="cancelarDoMapa(\''+c.id+'\')">🗑️ Cancelar pedido</button></div>';
      atualizarOuCriarMarcador(key, [c.destLat,c.destLng], html, tooltip, popup);
    }
  });

  cs.filter(c=>c.status==='aceita'||c.status==='em_rota').forEach(c=>{
    const pos = POS[c.id];
    const estaTravada = travadasIds.has(c.id);
    if(pos && pos.lat && pos.lng){
      const cor = estaTravada ? '#EF4444' : (c.status==='em_rota' ? '#00E676' : '#3B82F6');
      const key = 'moto-'+c.id;
      pontosAtuais.add(key);
      const html = '<div style="background:'+cor+';color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5);'+(estaTravada?'animation:pulse 1.5s infinite':'')+'">🏍️</div>';
      const tooltip = '🏍️ '+(c.motoqueiroNome||'Motoqueiro')+(estaTravada?' 🚨 TRAVADO':'')+'\n🙋 '+(c.passageiroNome||'—')+'\n💰 '+(c.valorAceito?brl(c.valorAceito):'—')+'\n'+badgeSt(c.status).replace(/<[^>]*>/g,'');
      const popup = '<div class="mapa-info"><b>🛵 EM CORRIDA</b> '+badgeSt(c.status)+(estaTravada?' <span class="badge b-trav">TRAVADO</span>':'')+'<br/><b>#'+esc(c.id.slice(-6))+'</b><br/>️ '+esc(c.motoqueiroNome||'—')+'<br/>🙋 '+esc(c.passageiroNome||'—')+'<br/>💰 '+(c.valorAceito?brl(c.valorAceito):'—')+'<br/>🕐 '+tempoAtras(c.criadaEm)+'<br/><button class="btn green mini" onclick="forcarConclusao(\''+c.id+'\')">✅ Forçar conclusão</button><br/><button class="btn red mini" onclick="abrirModalCancelar(\''+c.id+'\')">❌ Cancelar corrida</button></div>';
      atualizarOuCriarMarcador(key, [pos.lat,pos.lng], html, tooltip, popup);
      if(c.destLat && c.destLng){
        const keyLinha = 'linha-'+c.id;
        pontosAtuais.add(keyLinha);
        if(marcadoresMapa[keyLinha]){ marcadoresMapa[keyLinha].setLatLngs([[pos.lat,pos.lng],[c.destLat,c.destLng]]); }
        else { const linha = L.polyline([[pos.lat,pos.lng],[c.destLat,c.destLng]],{color:cor,weight:3,dashArray:'6 6',opacity:.7}).addTo(mapa); marcadoresMapa[keyLinha] = linha; }
      }
    }
  });

  listaPontos().forEach(p=>{
    if(p.lat && p.lng){
      const key = 'ponto-'+p.id;
      pontosAtuais.add(key);
      const html = '<div style="background:'+(p.cor||'#EF4444')+';color:#fff;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5)">'+(p.icone||'')+'</div>';
      const tooltip = '📌 '+p.nome+(p.obs?' — '+p.obs:'');
      const popup = '<div class="mapa-info"><b>📌 '+esc(p.nome)+'</b>'+(p.obs?'<br/><small>'+esc(p.obs)+'</small>':'')+'<br/><small style="color:#8B98A5">Adicionado por '+esc(p.criadoPor||'admin')+'</small><br/><button class="btn red mini" onclick="excluirPonto(\''+p.id+'\')">🗑️ Excluir ponto</button></div>';
      atualizarOuCriarMarcador(key, [p.lat,p.lng], html, tooltip, popup);
    }
  });

  const motoIdsEmCorrida = new Set(cs.filter(c=>c.status==='aceita'||c.status==='em_rota').map(c=>c.motoqueiroId));
  listaMoto().filter(m=>!m.bloqueado).forEach(m=>{
    if(motoIdsEmCorrida.has(m.id)) return;
    let ultimaPos = null;
    Object.entries(POS).forEach(([cid,p])=>{
      const corrida = C[cid];
      if(corrida && corrida.motoqueiroId === m.id && p && p.lat){ if(!ultimaPos || new Date(p.ts) > new Date(ultimaPos.ts)) ultimaPos = p; }
    });
    if(ultimaPos && ultimaPos.lat){
      const key = 'online-'+m.id;
      pontosAtuais.add(key);
      const html = '<div style="background:#10B981;color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);opacity:.8">🏍️</div>';
      const tooltip = '🟢 '+m.nome+'\n📞 '+m.telefone+'\n🛵 '+m.modelo+' '+m.placa;
      const popup = '<div class="mapa-info"><b>🟢 MOTOQUEIRO ONLINE</b><br/>🏍️ '+esc(m.nome||'—')+'<br/>📞 '+esc(m.telefone||'—')+'<br/> '+esc(m.modelo||'—')+' '+esc(m.placa||'')+'<br/> Última posição: '+dataHoraFmt(ultimaPos.ts)+'</div>';
      atualizarOuCriarMarcador(key, [ultimaPos.lat,ultimaPos.lng], html, tooltip, popup);
    }
  });

  Object.keys(marcadoresMapa).forEach(key => {
    if(!pontosAtuais.has(key)){ try{ mapa.removeLayer(marcadoresMapa[key]); }catch(e){} delete marcadoresMapa[key]; }
  });

  if(primeiraCargaMapa){
    primeiraCargaMapa = false;
    const todosPontos = [];
    Object.values(marcadoresMapa).forEach(m => { if(m.getLatLng) todosPontos.push(m.getLatLng()); });
    if(todosPontos.length > 0){ try{ mapa.fitBounds(L.latLngBounds(todosPontos),{padding:[50,50],maxZoom:13}); }catch(e){} }
  }
}

function atualizarOuCriarMarcador(key, latlng, html, tooltip, popup){
  if(marcadoresMapa[key]){
    try{
      marcadoresMapa[key].setLatLng(latlng);
      if(marcadoresMapa[key].getTooltip){ const tt = marcadoresMapa[key].getTooltip(); if(tt) tt.setContent(tooltip); }
      if(marcadoresMapa[key].getPopup){ const pp = marcadoresMapa[key].getPopup(); if(pp) pp.setContent(popup); }
    }catch(e){ try{ mapa.removeLayer(marcadoresMapa[key]); }catch(e2){} delete marcadoresMapa[key]; criarMarcador(key, latlng, html, tooltip, popup); }
  } else { criarMarcador(key, latlng, html, tooltip, popup); }
}

function criarMarcador(key, latlng, html, tooltip, popup){
  try{
    const mk = L.marker(latlng, { icon: L.divIcon({ html, className:'', iconSize:[36,36], iconAnchor:[18,18] }) }).addTo(mapa);
    mk.bindTooltip(tooltip, { direction:'top', offset:[0,-10], opacity:.95 });
    mk.bindPopup(popup, { maxWidth: 280 });
    marcadoresMapa[key] = mk;
  }catch(e){ console.error('Erro ao criar marcador:', e); }
}

function renderMoto(){

  const stats = id => { const cs = listaCorridas().filter(c=>c.motoqueiroId===id && c.status==='concluida'); return { n: cs.length, tot: cs.reduce((t,c)=>t+(parseFloat(c.valorAceito)||0),0) }; };
  
  let html = '<div class="card"><div class="busca-box"><input class="inp" id="buscaMotoInput" placeholder="🔍 Buscar por nome, telefone ou placa..." value="'+esc(buscaM)+'" autocomplete="off" oninput="buscaM=this.value;renderMoto()" style="flex:1"/><button class="btn ghost mini" onclick="limparBuscaMoto()"> Limpar</button></div></div>';

    html += '<div class="card" style="text-align:center;color:#6B7280">Nenhum motoqueiro encontrado.</div>';

window.fecharModalEditar = () => { const m = document.getElementById('modalEditar'); if(m) m.remove(); editando = null; };

window.salvarEditar = async () => {
  const {tipo,id} = editando;
  const nome = (document.getElementById('eNome').value||'').trim();
  const tel = (document.getElementById('eTel').value||'').replace(/\D/g,'');
  const senha = document.getElementById('eSenha').value||'';
  if(!nome){ toast('Informe o nome.',true); return; }
  if(tel.length<10){ toast('Telefone inválido.',true); return; }
  if(senha && senha.length<4){ toast('Senha muito curta.',true); return; }
  try{
    const lista = tipo==='p' ? listaPass() : listaMoto();
    if(lista.some(x=>x.telefone===tel && x.id!==id)){ toast('Telefone já usado por outra conta.',true); return; }
    const patch = { nome, telefone:tel };
    if(senha) patch.senhaHash = hash(senha);
    if(tipo==='m'){
      const placa = (document.getElementById('ePlaca').value||'').trim().toUpperCase();
      if(placa.length<6){ toast('Placa inválida.',true); return; }
      if(listaMoto().some(x=>x.placa===placa && x.id!==id)){ toast('Placa já usada por outra moto.',true); return; }
      patch.cnh = (document.getElementById('eCnh').value||'').trim();
      patch.placa = placa; patch.cor = (document.getElementById('eCor').value||'').trim();
      patch.modelo = (document.getElementById('eModelo').value||'').trim();
      patch.ano = (document.getElementById('eAno').value||'').trim();
      patch.pix = (document.getElementById('ePix').value||'').trim();
    }
    await api(`/${tipo==='p'?'passageiros':'motoqueiros'}/${id}.json`,'PATCH', patch);
    toast('✅ Cadastro atualizado!'); 
    fecharModalEditar();
    await loadAll(); renderTodasAbas();
  }catch(e){ toast('Erro: '+e.message,true); }
};

window.bloquear = async (tipo,id,blq) => {
  const nome = ((tipo==='p'?P[id]:M[id])||{}).nome||'';
  if(!confirm(`${blq?'BLOQUEAR':'DESBLOQUEAR'} ${nome}?`)) return;
  try{ await api(`/${tipo==='p'?'passageiros':'motoqueiros'}/${id}.json`,'PATCH',{ bloqueado: blq }); toast(blq ? '🚫 Conta bloqueada.' : '✅ Conta desbloqueada.'); await loadAll(); renderTodasAbas(); }catch(e){ toast('Erro: '+e.message,true); }
};

window.excluir = async (tipo,id,nome) => {
  if(!confirm(`EXCLUIR permanentemente ${nome}? Esta ação não tem volta.`)) return;
  if(!confirm('ÚLTIMA CHANCE: excluir mesmo?')) return;
  try{ await api(`/${tipo==='p'?'passageiros':'motoqueiros'}/${id}.json`,'DELETE'); toast('🗑️ Registro excluído.'); await loadAll(); renderTodasAbas(); }catch(e){ toast('Erro: '+e.message,true); }
};

// ===================== CORRIDAS & RELATÓRIOS =====================
function renderCor(){
  const el = document.getElementById('aba-cor');
  if(!el) return;
  const lista = corridasDoPeriodo().sort((a,b)=>new Date(b.criadaEm||0)-new Date(a.criadaEm||0));
  const concl = lista.filter(c=>c.status==='concluida');
  const tot = concl.reduce((t,c)=>t+(parseFloat(c.valorAceito)||0),0);
  const media = concl.length ? tot/concl.length : 0;
  const rank = {};
  concl.forEach(c=>{ const k = c.motoqueiroId||'sem'; if(!rank[k]) rank[k] = { nome: c.motoqueiroNome||'Sem motoqueiro', n:0, tot:0 }; rank[k].n++; rank[k].tot += parseFloat(c.valorAceito)||0; });
  const rankLista = Object.values(rank).sort((a,b)=>b.tot-a.tot);
  const travadasIds = new Set(detectarCorridasTravadas().map(t=>t.corrida.id));

  let html = '<div class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:end"><div style="flex:1;min-width:140px"><div class="lbl">Status</div><select class="inp" onchange="filtroStatus=this.value;renderCor()"><option value="todas" '+(filtroStatus==='todas'?'selected':'')+'>Todas</option><option value="aberta" '+(filtroStatus==='aberta'?'selected':'')+'>Abertas</option><option value="aceita" '+(filtroStatus==='aceita'?'selected':'')+'>Aceitas</option><option value="em_rota" '+(filtroStatus==='em_rota'?'selected':'')+'>Em rota</option><option value="concluida" '+(filtroStatus==='concluida'?'selected':'')+'>Concluídas</option><option value="cancelada" '+(filtroStatus==='cancelada'?'selected':'')+'>Canceladas</option></select></div><div style="flex:1;min-width:140px"><div class="lbl">Período</div><select class="inp" onchange="filtroPeriodo=this.value;renderCor()"><option value="1" '+(filtroPeriodo==='1'?'selected':'')+'>Hoje</option><option value="7" '+(filtroPeriodo==='7'?'selected':'')+'>Últimos 7 dias</option><option value="30" '+(filtroPeriodo==='30'?'selected':'')+'>Últimos 30 dias</option><option value="tudo" '+(filtroPeriodo==='tudo'?'selected':'')+'>Tudo</option></select></div><button class="btn green" onclick="exportarCSV()">⬇️ Exportar CSV</button></div>';
  html += '<div class="stats"><div class="stat"><div class="n" style="color:#3B82F6">'+lista.length+'</div><div class="l">Corridas no filtro</div></div><div class="stat"><div class="n" style="color:#9CA3AF">'+concl.length+'</div><div class="l">Concluídas</div></div><div class="stat"><div class="n" style="color:#00E676">'+brl(tot)+'</div><div class="l">Faturamento</div></div><div class="stat"><div class="n" style="color:#FFB300">'+brl(media)+'</div><div class="l">Ticket médio</div></div></div>';
  if(rankLista.length){
    html += '<div class="card"><div class="lbl" style="margin-bottom:8px">🏆 Ranking de motoqueiros (concluídas no período)</div><table><tr><th>Motoqueiro</th><th>Corridas</th><th>Faturou</th></tr>';
    rankLista.forEach(r => { html += '<tr><td>'+esc(r.nome)+'</td><td>'+r.n+'</td><td style="color:#00E676;font-weight:700">'+brl(r.tot)+'</td></tr>'; });
    html += '</table></div>';
  }
  html += '<div class="card"><div class="lbl" style="margin-bottom:8px">🛵 Corridas ('+lista.length+')</div>';
  if(lista.length === 0){
    html += '<p style="color:#6B7280;font-size:12px;text-align:center">Nenhuma corrida no filtro.</p>';
  } else {
    lista.forEach(c => {
      const pg = c.pagamento||{};
      const pgTxt = pg.status==='pago'?'PIX ✅':pg.metodo==='dinheiro'?'Dinheiro':pg.status==='pix_informado'?'PIX informado':'—';
      const ehTravada = travadasIds.has(c.id);
      const podeAgir = c.status === 'aberta' || c.status === 'aceita' || c.status === 'em_rota';
      html += '<div class="item '+(ehTravada?'travada':'')+'"><div class="head"><div><div class="nome">#'+esc(c.id.slice(-6))+' '+badgeSt(c.status)+(ehTravada?' <span class="badge b-trav">🚨 TRAVADA</span>':'')+'</div><div class="sub">🙋 '+esc(c.passageiroNome||'—')+' ('+esc(c.passageiroTel||'—')+')<br/> '+esc(c.origEndereco||'').slice(0,40)+' → 🏁 '+esc(c.destEndereco||'').slice(0,40)+'<br/>🏍️ '+esc(c.motoqueiroNome||'não atribuído')+' • 📏 '+(c.distanciaKm||'—')+' km • 🕐 '+dataHoraFmt(c.criadaEm)+(ehTravada?'<br/><b style="color:#EF4444">⚠️ Sem movimento há +'+TEMPO_MAX_SEM_GPS_MIN+' min</b>':'')+(c.motivoCancelamento?'<br/><small style="color:#EF4444">❌ '+esc(c.motivoCancelamento)+'</small>':'')+(c.motivoForca?'<br/><small style="color:#00E676">✅ '+esc(c.motivoForca)+'</small>':'')+'</div></div><div style="text-align:right"><div style="font-size:16px;font-weight:900;color:#00E676">'+(c.valorAceito?brl(c.valorAceito):'—')+'</div><div class="sub">'+pgTxt+'</div>'+(podeAgir ? '<div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;margin-top:6px"><button class="btn green mini" onclick="forcarConclusao(\''+c.id+'\')">✅ Forçar conclusão</button><button class="btn red mini" onclick="abrirModalCancelar(\''+c.id+'\')">❌ Cancelar</button>'+(c.status==='aberta'?'<button class="btn ghost mini" onclick="cancelarDoMapa(\''+c.id+'\')">🗑️ Apagar</button>':'')+'</div>' : '')+'</div></div></div>';
    });
  }
  html += '</div>';
  el.innerHTML = html;
}

};

window.exportarCSV = () => {
  const lista = corridasDoPeriodo().sort((a,b)=>new Date(b.criadaEm||0)-new Date(a.criadaEm||0));
  if(!lista.length){ toast('Nada para exportar no filtro.',true); return; }
  const linhas = [['ID','Data','Status','Passageiro','Tel Passageiro','Motoqueiro','Origem','Destino','Km','Valor','Pagamento','Motivo']];
  lista.forEach(c=>{const pg = c.pagamento||{};linhas.push([c.id, dataHoraFmt(c.criadaEm), c.status||'', c.passageiroNome||'', c.passageiroTel||'', c.motoqueiroNome||'', (c.origEndereco||'').replace(/;/g,','), (c.destEndereco||'').replace(/;/g,','), c.distanciaKm||'', (parseFloat(c.valorAceito)||0).toFixed(2), pg.status==='pago'?'PIX':pg.metodo==='dinheiro'?'DINHEIRO':pg.status||'', c.motivoCancelamento||c.motivoForca||'']);});
  const csv = '\uFEFF' + linhas.map(l=>l.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'vai-de-moto-corridas-'+new Date().toISOString().split('T')[0]+'.csv'; a.click(); URL.revokeObjectURL(a.href);
  toast('⬇️ CSV exportado!');
};

function renderPontos(){
  const el = document.getElementById('aba-pontos');
  if(!el) return;
  const pontos = listaPontos().sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
  let html = '<div class="card" style="background:rgba(168,85,247,.08);border-color:rgba(168,85,247,.4)"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><span style="font-size:28px"></span><div><b style="font-size:15px">Pontos de Interesse</b><p style="font-size:11px;color:#A855F7;margin:0">Marque locais importantes no mapa (hospitais, escolas, pontos de encontro)</p></div></div><button class="btn amber" onclick="mudarAba(\'mapa\');setTimeout(()=>{modoAdicionarPonto=true;toggleModoPonto();},100)">️ Ir para o mapa e adicionar</button></div>';
  html += '<div class="card"><div class="lbl" style="margin-bottom:8px">📌 Pontos salvos ('+pontos.length+')</div>';
  if(pontos.length === 0){
    html += '<p style="color:#6B7280;font-size:12px;text-align:center">Nenhum ponto marcado ainda.</p>';
  } else {
    pontos.forEach(p => {
      html += '<div class="ponto-item"><div class="ponto-cor" style="background:'+p.cor+'"></div><div style="font-size:20px">'+p.icone+'</div><div class="ponto-info"><b>'+esc(p.nome)+'</b><small>'+(p.obs?esc(p.obs)+' • ':'')+' '+p.lat.toFixed(4)+', '+p.lng.toFixed(4)+' • por '+esc(p.criadoPor||'admin')+'</small></div><button class="btn red mini" onclick="excluirPonto(\''+p.id+'\')">🗑️</button></div>';
    });
  }
  html += '</div>';
  el.innerHTML = html;
}

function renderAdm(){
  const el = document.getElementById('aba-adm');
  if(!el) return;
  api('/admins.json','GET').then(admins=>{
    const lista = Object.values(admins||{});
    let html = '<div class="card" style="max-width:520px"><div class="lbl">Trocar MINHA senha</div><input class="inp" id="mSenha" type="password" placeholder="Nova senha (mín. 6)" style="margin-bottom:10px"/><button class="btn amber" onclick="trocarMinhaSenha()">🔑 Trocar minha senha</button></div>';
    html += '<div class="card" style="max-width:520px"><div class="lbl">Criar admin adicional</div><input class="inp" id="nNome" placeholder="Nome" style="margin-bottom:8px"/><input class="inp" id="nUser" placeholder="Usuário" style="margin-bottom:8px"/><input class="inp" id="nSenha" type="password" placeholder="Senha (mín. 6)" style="margin-bottom:10px"/><button class="btn green" onclick="criarAdminExtra()">➕ Criar admin</button></div>';
    html += '<div class="card" style="max-width:520px"><div class="lbl" style="margin-bottom:8px">👑 Administradores ('+lista.length+')</div>';
    lista.forEach(a => {
      html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.06)"><span style="font-size:13px"><b>'+esc(a.nome||'—')+'</b> <span style="color:#8B98A5">(@'+esc(a.usuario||'')+')</span></span>'+(a.id!==sessao.id?'<button class="btn red mini" onclick="excluirAdmin(\''+a.id+'\',\''+esc(a.nome||'')+'\')">🗑️</button>':'<span class="badge b-ok">VOCÊ</span>')+'</div>';
    });
    html += '</div>';
    el.innerHTML = html;
  });
}

window.trocarMinhaSenha = async () => {
  const s = document.getElementById('mSenha').value||'';
  if(s.length<6){ toast('Senha mín. 6 caracteres.',true); return; }
  await api('/admins/'+sessao.id+'.json','PATCH',{ senhaHash: hash(s) });
  toast('🔑 Senha trocada!'); document.getElementById('mSenha').value='';
};

window.criarAdminExtra = async () => {
  const nome = (document.getElementById('nNome').value||'').trim();
  const user = (document.getElementById('nUser').value||'').trim().toLowerCase();
  const senha = document.getElementById('nSenha').value||'';
  if(!nome||!user){ toast('Preencha nome e usuário.',true); return; }
  if(senha.length<6){ toast('Senha mín. 6.',true); return; }
  const admins = await api('/admins.json','GET')||{};
  if(Object.values(admins).some(a=>a.usuario===user)){ toast('Usuário já existe.',true); return; }
  const id = 'adm-'+Date.now();
  await api('/admins/'+id+'.json','PUT',{ id, nome, usuario:user, senhaHash:hash(senha), criadoEm:new Date().toISOString() });
  toast('➕ Admin criado!'); renderTodasAbas();
};

window.excluirAdmin = async (id,nome) => {
  if(!confirm('Excluir o admin '+nome+'?')) return;
  await api('/admins/'+id+'.json','DELETE'); toast('🗑️ Admin excluído.'); renderTodasAbas();
};

(async function init(){
  const s = carregarSessao();
  if(s){ sessao = s; await loadAll(); mostrarPainel(); }
  else { renderLogin(); }
})();
</script>
