<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#FFB300"/>
<title>VAI DE MOTO</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;background:radial-gradient(ellipse at top,#1a1408 0%,#0B0F14 60%);color:#E6EDF3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{width:100%;max-width:420px;text-align:center}
  .logo{font-size:44px;font-weight:900;letter-spacing:-1px;margin-bottom:6px}
  .logo span{color:#FFB300}
  .sub{color:#9CA3AF;font-size:14px;margin-bottom:36px;line-height:1.5}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;border-radius:16px;border:none;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none;margin-bottom:14px;font-family:inherit}
  .btn.amber{background:linear-gradient(135deg,#FFB300,#FF8F00);color:#1a1408;box-shadow:0 10px 26px rgba(255,179,0,.3)}
  .btn.dark{background:#151B23;border:1px solid #2A3542;color:#E6EDF3}
  .btn:active{transform:scale(.98)}
  .foot{margin-top:28px;font-size:11px;color:#6B7280;line-height:1.6}
  .ico{font-size:26px}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">🏍️ VAI DE <span>MOTO</span></div>
    <div class="sub">Sua corrida de moto em minutos.<br/>Você pede, os motoqueiros ofertam, você escolhe o melhor preço.</div>
    <a class="btn amber" href="passageiro.html"><span class="ico">🙋</span> Sou Passageiro</a>
    <a class="btn dark" href="motoqueiro.html"><span class="ico">🏍️</span> Sou Motoqueiro</a>
    <div class="foot">Ao continuar você concorda com os termos de uso.<br/>Em breve: aplicativo instalável (APK) nas lojas.</div>
  </div>
</body>
</html>
