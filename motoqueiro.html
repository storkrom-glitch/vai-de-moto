<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#FFB300"/>
<title>VAI DE MOTO — Motoqueiro</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:#0B0F14;color:#E6EDF3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5;min-height:100vh}
  .topo{position:fixed;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(11,15,20,.97);border-bottom:1px solid rgba(255,179,0,.25);z-index:50}
  .logo{font-size:16px;font-weight:900}
  .logo span{color:#FFB300}
  .chip{font-size:11px;color:#9CA3AF;background:#151B23;border:1px solid #2A3542;padding:5px 10px;border-radius:999px;max-width:45vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip.on{color:#00E676;border-color:rgba(0,230,118,.4);background:rgba(0,230,118,.08)}
  .wrap{max-width:520px;margin:0 auto;padding:66px 14px 24px}
  .card{background:#10161D;border:1px solid #1F2937;border-radius:16px;padding:16px;margin-bottom:12px}
  .lbl{font-size:10px;color:#8B98A5;text-transform:uppercase;letter-spacing:.8px;margin:0 0 5px;font-weight:700}
  .inp{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #2A3542;background:#0D1218;color:#E6EDF3;font-size:15px;outline:none;font-family:inherit}
  .inp:focus{border-color:#FFB300}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:12px;border:none;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;color:#fff;text-decoration:none}
  .btn:active{transform:scale(.98)}
  .btn.amber{background:linear-gradient(135deg,#FFB300,#FF8F00);color:#1a1408}
  .btn.green{background:linear-gradient(135deg,#00E676,#00B25A);color:#04140B}
  .btn.blue{background:linear-gradient(135deg,#3B82F6,#2563EB)}
  .btn.red{background:linear-gradient(135deg,#EF4444,#DC2626)}
  .btn.ghost{background:transparent;border:1px solid #2A3542;color:#9CA3AF}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{flex:1;padding:10px;border-radius:10px;border:1px solid #2A3542;background:transparent;color:#9CA3AF;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}
  .tab.on{background:rgba(255,179,0,.12);border-color:#FFB300;color:#FFB300}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .corridaCard{background:#10161D;border:1px solid #1F2937;border-left:4px solid #FFB300;border-radius:14px;padding:14px;margin-bottom:12px}
  .ccTop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
  .ccDist{font-size:12px;font-weight:800;color:#FFB300;white-space:nowrap}
  .ccTime{font-size:10px;color:#6B7280}
  .ccEnd{font-size:12.5px;color:#D1D5DB;margin:3px 0;word-wrap:break-word}
  .ccEnd b{color:#8B98A5;font-weight:700;font-size:10px;text-transform:uppercase;display:block}
  .ccOferta{display:flex;gap:8px;margin-top:10px;align-items:center}
  .ccOferta .inp{flex:1;padding:10px 12px;font-size:15px;font-weight:800;color:#00E676}
  .ccOferta .btn{width:auto;min-height:44px;padding:0 16px;font-size:12px}
  .ccEsperando{margin-top:10px;padding:10px;border-radius:10px;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.3);color:#3B82F6;font-size:12px;font-weight:700;text-align:center}
  .ccSug{font-size:10px;color:#6B7280;margin-top:6px}
  .statusbox{padding:12px;border-radius:12px;text-align:center;font-weight:800;font-size:13px;margin-bottom:12px;border:1px solid}
  .pCard{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:#0D1218;border:1px solid #1F2937;margin-bottom:12px}
  .pCard .avatar{width:48px;height:48px;border-radius:50%;background:rgba(0,230,118,.12);border:2px solid rgba(0,230,118,.35);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
  .pCard .info{flex:1;min-width:0}
  .pCard .nome{font-weight:800;font-size:14px}
  .pCard .det{font-size:11px;color:#9CA3AF;margin-top:2px}
  .rowval{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px dashed rgba(255,255,255,.07)}
  .rowval:last-child{border-bottom:none}
  .rowval .k{color:#8B98A5}
  .rowval .v{font-weight:700}
  #mapaMinha{height:220px;border-radius:14px;overflow:hidden;background:#0E1A24;margin-bottom:12px}
  .state{text-align:center;padding:36px 10px;color:#8B98A5}
  .state .big{font-size:42px;margin-bottom:8px}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#FFB300;color:#1a1408;font-weight:800;font-size:12px;padding:11px 18px;border-radius:999px;opacity:0;transition:opacity .3s;z-index:999;max-width:90vw;text-align:center;pointer-events:none}
  #toast.show{opacity:1}
  #toast.err{background:#EF4444;color:#fff}
</style>
</head>
<body>

<div class="topo">
  <div class="logo">🏍️ VAI DE <span>MOTO</span> • Parceiro</div>
  <div class="chip" id="userchip" style="display:none"></div>
</div>

<div class="wrap" id="app"></div>
<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script>
const FB = window.VDM.firebaseURL;
const KEY_SESSAO = 'vdm_motoqueiro';

let sessao = null;
let tela = 'login';
let modoLogin = 'entrar';
let pollTimer = null;
let bloqueioTimer = null;
let gpsWatch = null;
let myPos = null;
let lastPosSend = 0;
let minhaCorrida = null;
let ultimaAssinatura = '';
let corridasVistas = {};
let map = null, mkMoto = null, mkOrig = null, mkDest = null, linha = null;
let audioCtx = null;
let lastPgStatusM = '';

const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return'h'+h.toString(36);}
const brl = v => 'R$ ' + (parseFloat(v)||0).toFixed(2).replace('.',',');

function toast(msg,err){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (err?' err':'');
  setTimeout(()=>t.className='', 3200);
}

function beep(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(740,t); o.frequency.setValueAtTime(988,t+.12); o.frequency.setValueAtTime(1244,t+.24);
    g.gain.setValueAtTime(.28,t); g.gain.exponentialRampToValueAtTime(.01,t+.6);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+.6);
  }catch(e){}
}

async function api(caminho, method, body){
  const opts = { method, headers:{'Content-Type':'application/json'} };
  if(body) opts.body = JSON.stringify(body);
  const r = await fetch(FB + caminho, opts);
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return await r.json();
}

function tempoAtras(iso){
  const min = Math.floor((Date.now() - new Date(iso).getTime())/60000);
  if(min < 1) return 'agora';
  if(min < 60) return 'há ' + min + ' min';
  const h = Math.floor(min/60);
  return 'há ' + h + 'h' + (min%60>0 ? (min%60) : '');
}

function salvarSessao(u){ sessao=u; localStorage.setItem(KEY_SESSAO, JSON.stringify(u)); }
function carregarSessao(){ try{ return JSON.parse(localStorage.getItem(KEY_SESSAO)); }catch(e){ return null; } }

function atualizarChip(){
  const chip = document.getElementById('userchip');
  if(sessao){ chip.style.display='block'; chip.className='chip on'; chip.textContent='🟢 Online • '+sessao.nome.split(' ')[0]; }
  else chip.style.display='none';
}

// ===================== BLOQUEIO PELO ADMIN =====================
async function verificarBloqueio(){
  if(!sessao) return;
  try{
    const m = await api('/motoqueiros/'+sessao.id+'.json','GET');
    if(!m || m.bloqueado === true){
      pararTudo();
      localStorage.removeItem(KEY_SESSAO);
      sessao = null; minhaCorrida = null;
      tela = 'login'; render();
      toast('🚫 Sua conta foi bloqueada pelo administrador.', true);
    }
  }catch(e){}
}

// ===================== GPS / TRANSMISSÃO =====================
function iniciarTransmissao(cid){
  if(gpsWatch !== null) return;
  if(!('geolocation' in navigator)) return;
  gpsWatch = navigator.geolocation.watchPosition(
    p => {
      myPos = { lat:p.coords.latitude, lng:p.coords.longitude };
      const agora = Date.now();
      if(agora - lastPosSend >= 4000){
        lastPosSend = agora;
        api('/posicoes/'+cid+'.json','PUT',{ lat:myPos.lat, lng:myPos.lng, ts:new Date().toISOString() }).catch(()=>{});
      }
      atualizarMeuMarker();
    },
    err => {},
    { enableHighAccuracy:true, timeout:15000, maximumAge:2000 }
  );
}
function pararTransmissao(){
  if(gpsWatch !== null){ navigator.geolocation.clearWatch(gpsWatch); gpsWatch = null; }
}
function atualizarMeuMarker(){
  if(!map || !myPos) return;
  if(!mkMoto){
    mkMoto = L.marker([myPos.lat,myPos.lng],{icon:L.divIcon({html:'<div style="font-size:28px">🏍️</div>',className:'',iconSize:[32,32],iconAnchor:[16,16]})}).addTo(map);
  } else mkMoto.setLatLng([myPos.lat,myPos.lng]);
  if(minhaCorrida){
    const alvo = (minhaCorrida.status==='aceita') ? [minhaCorrida.origLat,minhaCorrida.origLng] : [minhaCorrida.destLat,minhaCorrida.destLng];
    if(linha) map.removeLayer(linha);
    linha = L.polyline([[myPos.lat,myPos.lng],alvo],{color:'#FFB300',weight:4,dashArray:'8 8',opacity:.85}).addTo(map);
  }
}

// ===================== RENDER =====================
function render(){
  atualizarChip();
  limparMapa();
  const app = document.getElementById('app');
  if(tela==='login') return renderLogin(app);
  if(tela==='feed') return renderFeed(app);
  if(tela==='minha') return renderMinha(app);
}

function renderLogin(app){
  app.innerHTML = `
    <div class="card" style="margin-top:12px">
      <div style="text-align:center;margin-bottom:14px">
        <div style="font-size:34px">🏍️</div>
        <b style="font-size:15px">Área do Motoqueiro Parceiro</b>
        <p style="font-size:11px;color:#8B98A5;margin-top:3px">Cadastre-se com seus dados e os da sua moto</p>
      </div>
      <div class="tabs">
        <button class="tab ${modoLogin==='entrar'?'on':''}" onclick="setModo('entrar')">🔐 Entrar</button>
        <button class="tab ${modoLogin==='criar'?'on':''}" onclick="setModo('criar')">📝 Cadastro</button>
      </div>
      <div id="camposLogin"></div>
    </div>
    <div style="text-align:center;margin-top:10px"><a href="index.html" style="color:#6B7280;font-size:12px;text-decoration:none">← Voltar ao início</a></div>
  `;
  desenharCamposLogin();
}

window.setModo = m => { modoLogin = m; renderLogin(document.getElementById('app')); };

function desenharCamposLogin(){
  const box = document.getElementById('camposLogin');
  if(!box) return;
  if(modoLogin==='entrar'){
    box.innerHTML = `
      <div class="lbl">Telefone (com DDD)</div>
      <input class="inp" id="liTel" type="tel" placeholder="Ex: 21988887777" style="margin-bottom:10px"/>
      <div class="lbl">Senha</div>
      <input class="inp" id="liSenha" type="password" placeholder="••••••" style="margin-bottom:14px"/>
      <button class="btn amber" onclick="fazerLogin()">Entrar e ficar online</button>
    `;
  } else {
    box.innerHTML = `
      <div class="lbl">Nome completo</div>
      <input class="inp" id="rgNome" placeholder="Ex: João Souza" style="margin-bottom:10px"/>
      <div class="grid2" style="margin-bottom:10px">
        <div><div class="lbl">Telefone (DDD)</div><input class="inp" id="rgTel" type="tel" placeholder="21988887777"/></div>
        <div><div class="lbl">CNH</div><input class="inp" id="rgCnh" placeholder="Nº da CNH"/></div>
      </div>
      <div class="lbl">Senha (mín. 4)</div>
      <input class="inp" id="rgSenha" type="password" placeholder="••••••" style="margin-bottom:12px"/>
      <div style="padding:10px;border-radius:10px;background:rgba(255,179,0,.07);border:1px solid rgba(255,179,0,.3);margin-bottom:10px">
        <div class="lbl" style="color:#FFB300">🏍️ Dados da moto</div>
        <div class="grid2" style="margin-bottom:10px">
          <div><div class="lbl">Placa</div><input class="inp" id="rgPlaca" placeholder="ABC1D23" style="text-transform:uppercase"/></div>
          <div><div class="lbl">Cor</div><input class="inp" id="rgCor" placeholder="Vermelha"/></div>
        </div>
        <div class="grid2">
          <div><div class="lbl">Modelo</div><input class="inp" id="rgModelo" placeholder="CG 160 Fan"/></div>
          <div><div class="lbl">Ano</div><input class="inp" id="rgAno" type="number" placeholder="2022"/></div>
        </div>
      </div>
      <div class="lbl">💠 Chave PIX (para receber as corridas)</div>
      <input class="inp" id="rgPix" placeholder="Telefone, CPF, e-mail ou chave aleatória" style="margin-bottom:12px"/>
      <p style="font-size:10px;color:#6B7280;margin:-6px 0 10px">Sem chave PIX, você só recebe corridas pagas em dinheiro.</p>
      <button class="btn green" onclick="criarConta()">Criar conta de parceiro</button>
    `;
  }
}

window.criarConta = async () => {
  const nome = (document.getElementById('rgNome').value||'').trim();
  const tel = (document.getElementById('rgTel').value||'').replace(/\D/g,'');
  const cnh = (document.getElementById('rgCnh').value||'').trim();
  const senha = document.getElementById('rgSenha').value||'';
  const placa = (document.getElementById('rgPlaca').value||'').trim().toUpperCase();
  const cor = (document.getElementById('rgCor').value||'').trim();
  const modelo = (document.getElementById('rgModelo').value||'').trim();
  const ano = (document.getElementById('rgAno').value||'').trim();
  const pix = (document.getElementById('rgPix').value||'').trim();
  if(!nome){ toast('Informe seu nome.',true); return; }
  if(tel.length < 10){ toast('Telefone inválido (use DDD).',true); return; }
  if(!cnh){ toast('Informe o número da CNH.',true); return; }
  if(senha.length < 4){ toast('Senha muito curta.',true); return; }
  if(placa.length < 6){ toast('Placa inválida.',true); return; }
  if(!modelo){ toast('Informe o modelo da moto.',true); return; }
  try{
    const todos = await api('/motoqueiros.json','GET') || {};
    if(Object.values(todos).some(m => m && m.telefone === tel)){ toast('Este telefone já é cadastrado. Use Entrar.',true); return; }
    if(Object.values(todos).some(m => m && m.placa === placa)){ toast('Já existe uma moto com esta placa.',true); return; }
    const id = 'm' + Date.now();
    await api('/motoqueiros/'+id+'.json','PUT',{
      id, nome, telefone:tel, cnh, senhaHash:hash(senha),
      placa, cor, modelo, ano, pix,
      bloqueado:false, ativo:true,
      criadoEm:new Date().toISOString()
    });
    salvarSessao({ id, nome, telefone:tel, placa, modelo, cor });
    beep();
    toast('✅ Cadastro aprovado! Você está online.');
    entrarNoSistema();
  }catch(e){ toast('Erro: '+e.message,true); }
};

window.fazerLogin = async () => {
  const tel = (document.getElementById('liTel').value||'').replace(/\D/g,'');
  const senha = document.getElementById('liSenha').value||'';
  if(!tel || !senha){ toast('Preencha telefone e senha.',true); return; }
  try{
    const todos = await api('/motoqueiros.json','GET') || {};
    const achado = Object.values(todos).find(m => m && m.telefone === tel);
    if(!achado){ toast('Conta não encontrada. Faça o cadastro.',true); return; }
    if(achado.senhaHash !== hash(senha)){ toast('Senha incorreta.',true); return; }
    if(achado.bloqueado === true){ toast('🚫 Conta bloqueada pelo administrador.',true); return; }
    salvarSessao({ id:achado.id, nome:achado.nome, telefone:achado.telefone, placa:achado.placa, modelo:achado.modelo, cor:achado.cor });
    toast('✅ Online! Boas corridas, '+achado.nome.split(' ')[0]+'!');
    entrarNoSistema();
  }catch(e){ toast('Erro: '+e.message,true); }
};

function entrarNoSistema(){
  tela='feed';
  render();
  iniciarPolling();
  iniciarVerificacaoBloqueio();
}

window.sair = () => {
  if(!confirm('Sair e ficar offline?')) return;
  pararTudo();
  localStorage.removeItem(KEY_SESSAO);
  sessao=null; minhaCorrida=null;
  tela='login'; render();
};

function pararTudo(){
  pararPolling();
  pararTransmissao();
  if(bloqueioTimer){ clearInterval(bloqueioTimer); bloqueioTimer=null; }
}
function iniciarVerificacaoBloqueio(){
  if(bloqueioTimer) clearInterval(bloqueioTimer);
  bloqueioTimer = setInterval(verificarBloqueio, 15000);
}

// ===================== FEED =====================
function renderFeed(app){
  app.innerHTML = `
    <div class="statusbox" style="color:#00E676;background:rgba(0,230,118,.08);border-color:rgba(0,230,118,.4)">
      🟢 Você está online — vendo todos os pedidos novos
    </div>
    <div class="lbl" style="margin:0 0 8px">📡 Pedidos de corrida abertos</div>
    <div id="listaFeed"><div class="state"><div class="big">📡</div>Buscando pedidos...</div></div>
    <button class="btn ghost" onclick="sair()">🚪 Sair / ficar offline</button>
  `;
}

function desenharFeed(abertas){
  const lista = document.getElementById('listaFeed');
  if(!lista) return;
  if(abertas.length === 0){
    lista.innerHTML = '<div class="state"><div class="big">📭</div>Nenhum pedido aberto agora.<br/>Você será avisado com som quando chegar um.</div>';
    return;
  }
  lista.innerHTML = abertas.map(c => {
    const minhaOferta = c.ofertas && sessao && c.ofertas[sessao.id] ? c.ofertas[sessao.id] : null;
    const sug = Math.round((5 + 2 * (parseFloat(c.distanciaKm)||0)) );
    return `
    <div class="corridaCard">
      <div class="ccTop">
        <span class="ccDist">📏 ${c.distanciaKm||'—'} km</span>
        <span class="ccTime">🕐 ${tempoAtras(c.criadaEm)}</span>
      </div>
      <div class="ccEnd"><b>📍 Buscar em</b>${esc(c.origEndereco||'Local do passageiro')}</div>
      <div class="ccEnd"><b>🏁 Levar até</b>${esc(c.destEndereco||'—')}</div>
      <div class="ccEnd"><b>👤 Passageiro</b>${esc(c.passageiroNome||'—')}</div>
      ${minhaOferta ? `
        <div class="ccEsperando">⏳ Sua oferta de ${brl(minhaOferta.valor)} foi enviada — aguardando o passageiro escolher</div>
      ` : `
        <div class="ccOferta">
          <input class="inp" id="val_${c.id}" type="number" min="1" step="0.5" placeholder="Seu preço R$"/>
          <button class="btn amber" onclick="enviarOferta('${c.id}')">💰 Ofertar</button>
        </div>
        <div class="ccSug">💡 Sugestão pela distância (${c.distanciaKm||0} km): ${brl(sug)} — você decide seu preço</div>
      `}
    </div>`;
  }).join('');
}

window.enviarOferta = async (cid) => {
  const inp = document.getElementById('val_'+cid);
  if(!inp || !sessao) return;
  const valor = parseFloat(inp.value);
  if(!valor || valor <= 0){ toast('Digite o valor da sua oferta.',true); return; }
  try{
    await api('/corridas/'+cid+'/ofertas/'+sessao.id+'.json','PUT',{
      valor,
      nome: sessao.nome,
      placa: sessao.placa,
      modelo: sessao.modelo,
      cor: sessao.cor,
      ts: new Date().toISOString()
    });
    beep();
    toast('💰 Oferta de '+brl(valor)+' enviada!');
    ultimaAssinatura = '';
  }catch(e){ toast('Erro: '+e.message,true); }
};

// ===================== CARD DE PAGAMENTO (MOTOQUEIRO) =====================
function cardPagamentoM(c){
  const pg = c.pagamento || {metodo:null, status:'pendente'};
  const valor = brl(c.valorAceito);

  if(pg.status==='pago'){
    return `<div class="card" style="border-color:rgba(0,230,118,.5);background:rgba(0,230,118,.06)">
      <div class="rowval" style="border:none"><span class="k">🟢 PIX RECEBIDO</span><span class="v" style="color:#00E676">${valor}</span></div>
      <p style="font-size:11px;color:#9CA3AF;margin-top:4px">Pagamento confirmado. Pode rodar tranquilo!</p>
    </div>`;
  }
  if(pg.metodo==='dinheiro'){
    return `<div class="card">
      <div class="rowval" style="border:none"><span class="k">💵 Receberá em dinheiro</span><span class="v">${valor}</span></div>
      <p style="font-size:11px;color:#9CA3AF;margin-top:4px">Cobre do passageiro durante ou ao final da corrida.</p>
    </div>`;
  }
  if(pg.status==='pix_informado'){
    return `<div class="card" style="border-color:rgba(59,130,246,.5)">
      <div class="lbl" style="color:#3B82F6">🔵 Passageiro informou que pagou — ${valor}</div>
      <p style="font-size:11px;color:#9CA3AF;margin:4px 0 10px">Confira seu app do banco. Se o PIX caiu, confirme abaixo para liberar a corrida.</p>
      <button class="btn green" onclick="confirmarPix()">💰 Confirmar recebimento do PIX</button>
    </div>`;
  }
  if(pg.metodo==='pix'){
    return `<div class="card">
      <div class="rowval" style="border:none"><span class="k">💠 Passageiro vai pagar via PIX</span><span class="v">${valor}</span></div>
      <p style="font-size:11px;color:#9CA3AF;margin-top:4px">O valor cairá na sua chave: <b style="color:#E6EDF3">${esc(sessao.pix||'(não cadastrada)')}</b></p>
    </div>`;
  }
  return `<div class="card">
    <div class="rowval" style="border:none"><span class="k">⏳ Pagamento</span><span class="v">Aguardando passageiro</span></div>
    <p style="font-size:11px;color:#9CA3AF;margin-top:4px">O passageiro ainda vai escolher PIX ou dinheiro. Você só inicia após o pagamento estar ok.</p>
  </div>`;
}

window.confirmarPix = async () => {
  if(!minhaCorrida) return;
  if(!confirm('O PIX realmente caiu na sua conta? Confirme para liberar a corrida.')) return;
  try{
    const pg = Object.assign({}, minhaCorrida.pagamento || {}, { status:'pago', confirmadoEm:new Date().toISOString() });
    await api('/corridas/'+minhaCorrida.id+'.json','PATCH',{ pagamento:pg });
    beep();
    toast('🟢 Pagamento confirmado! Corrida liberada.');
    ultimaAssinatura='';
  }catch(e){ toast('Erro: '+e.message,true); }
};

// ===================== MINHA CORRIDA =====================
function renderMinha(app){
  const c = minhaCorrida;
  if(!c){ tela='feed'; return renderFeed(app); }
  const emRota = c.status === 'em_rota';
  const pg = c.pagamento || {metodo:null, status:'pendente'};
  const pagoOk = pg.status==='pago' || pg.metodo==='dinheiro';
  app.innerHTML = `
    <div class="statusbox" style="${emRota ? 'color:#00E676;background:rgba(0,230,118,.08);border-color:rgba(0,230,118,.4)' : 'color:#3B82F6;background:rgba(59,130,246,.08);border-color:rgba(59,130,246,.4)'}">
      ${emRota ? '🛵 CORRIDA EM ANDAMENTO — GPS transmitindo' : '✅ CORRIDA ACEITA — vá buscar o passageiro'}
    </div>
    <div class="card"><div id="mapaMinha"></div></div>
    <div class="pCard">
      <div class="avatar">🙋</div>
      <div class="info">
        <div class="nome">${esc(c.passageiroNome||'Passageiro')}</div>
        <div class="det">📞 ${esc(c.passageiroTel||'—')}</div>
      </div>
      <a class="btn blue" style="width:auto;min-height:40px;padding:0 12px;font-size:12px" href="tel:+55${esc(String(c.passageiroTel||'').replace(/\D/g,''))}">Ligar</a>
    </div>
    ${cardPagamentoM(c)}
    <div class="card">
      <div class="rowval"><span class="k">📍 Buscar em</span><span class="v" style="max-width:62%;text-align:right;font-weight:500;font-size:11px">${esc(c.origEndereco||'—')}</span></div>
      <div class="rowval"><span class="k">🏁 Levar até</span><span class="v" style="max-width:62%;text-align:right;font-weight:500;font-size:11px">${esc(c.destEndereco||'—')}</span></div>
      <div class="rowval"><span class="k">💰 Você recebe</span><span class="v" style="color:#00E676;font-size:16px">${brl(c.valorAceito)}</span></div>
    </div>
    <a class="btn blue" style="margin-bottom:10px" target="_blank" rel="noopener"
       href="https://www.google.com/maps/search/?api=1&query=${c.origLat},${c.origLng}">🗺️ Navegar até o passageiro (Google Maps)</a>
    ${!emRota ? (pagoOk ? `
      <button class="btn green" onclick="iniciarCorrida()">🛵 INICIAR CORRIDA (passageiro a bordo)</button>
    ` : `
      <button class="btn ghost" disabled>⏳ Aguardando pagamento do passageiro</button>
    `) : `
      <button class="btn amber" onclick="concluirCorrida()">🏁 CONCLUIR CORRIDA</button>
    `}
  `;
  iniciarMapaMinha();
  iniciarTransmissao(c.id);
}

function iniciarMapaMinha(){
  const el = document.getElementById('mapaMinha');
  if(!el || !minhaCorrida) return;
  const c = minhaCorrida;
  map = L.map(el,{zoomControl:true,attributionControl:false}).setView([c.origLat,c.origLng],14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map);
  mkOrig = L.marker([c.origLat,c.origLng],{icon:L.divIcon({html:'<div style="font-size:26px">🙋</div>',className:'',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map);
  mkDest = L.marker([c.destLat,c.destLng],{icon:L.divIcon({html:'<div style="font-size:26px">🏁</div>',className:'',iconSize:[30,30],iconAnchor:[15,30]})}).addTo(map);
  if(myPos) atualizarMeuMarker();
  setTimeout(()=>map.invalidateSize(),300);
}

window.iniciarCorrida = async () => {
  if(!minhaCorrida) return;
  if(!confirm('O passageiro já está na moto? Iniciando a corrida.')) return;
  try{
    await api('/corridas/'+minhaCorrida.id+'.json','PATCH',{ status:'em_rota', iniciadaEm:new Date().toISOString() });
    toast('🛵 Corrida iniciada! Boa viagem.');
    ultimaAssinatura='';
  }catch(e){ toast('Erro: '+e.message,true); }
};

window.concluirCorrida = async () => {
  if(!minhaCorrida) return;
  if(!confirm('Concluir a corrida de '+brl(minhaCorrida.valorAceito)+'?')) return;
  try{
    await api('/corridas/'+minhaCorrida.id+'.json','PATCH',{ status:'concluida', concluidaEm:new Date().toISOString() });
    pararTransmissao();
    beep();
    toast('🏁 Corrida concluída! Valor: '+brl(minhaCorrida.valorAceito));
    minhaCorrida = null;
    tela='feed'; render();
  }catch(e){ toast('Erro: '+e.message,true); }
};

// ===================== POLLING =====================
function iniciarPolling(){
  pararPolling();
  pollTimer = setInterval(tick, window.VDM.pollMs || 4000);
  tick();
}
function pararPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }

async function tick(){
  if(!sessao) return;
  try{
    const todas = await api('/corridas.json','GET') || {};
    const lista = Object.entries(todas).map(([id,c])=>({ id, ...c }));

    const minha = lista.find(c => (c.status==='aceita' || c.status==='em_rota') && c.motoqueiroId === sessao.id);

    if(minha){
      const pgSt = (minha.pagamento && minha.pagamento.status) || 'pendente';
      const mudou = !minhaCorrida || minhaCorrida.status !== minha.status || pgSt !== lastPgStatusM;
      if(pgSt==='pix_informado' && lastPgStatusM!=='pix_informado'){
        beep();
        toast('🔵 Passageiro informou que pagou o PIX — confirme o recebimento!');
      }
      lastPgStatusM = pgSt;
      minhaCorrida = minha;
      if(tela !== 'minha'){
        tela='minha'; render(); beep();
        toast('🎉 Você foi escolhido! Corrida: '+brl(minha.valorAceito));
      } else if(mudou){
        render();
      } else {
        atualizarMeuMarker();
      }
      return;
    }

    if(minhaCorrida && !minha){
      minhaCorrida = null;
      pararTransmissao();
      lastPgStatusM = '';
      if(tela==='minha'){ tela='feed'; render(); toast('Corrida encerrada.'); }
    }

    if(tela !== 'feed') return;

    const abertas = lista.filter(c => c.status==='aberta');
    abertas.sort((a,b)=> new Date(b.criadaEm) - new Date(a.criadaEm));

    abertas.forEach(c => {
      if(!corridasVistas[c.id]){
        corridasVistas[c.id] = true;
        beep();
        toast('🆕 Novo pedido de corrida!');
      }
    });

    const sig = abertas.map(c => c.id + '|' + (c.ofertas && c.ofertas[sessao.id] ? c.ofertas[sessao.id].valor : '-')).join(',');
    if(sig !== ultimaAssinatura){
      ultimaAssinatura = sig;
      desenharFeed(abertas);
    }
  }catch(e){}
}

// ===================== MAPA UTILS =====================
function limparMapa(){
  if(map){ map.remove(); map=null; }
  mkMoto=mkOrig=mkDest=null; linha=null;
}

// ===================== INIT =====================
(function init(){
  const s = carregarSessao();
  if(s){
    sessao = s;
    entrarNoSistema();
  } else {
    render();
  }
})();
</script>
