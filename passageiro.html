function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return'h'+h.toString(36);}

function toast(msg,err){

function beep(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(880,t); o.frequency.setValueAtTime(1174,t+.12);
    g.gain.setValueAtTime(.25,t); g.gain.exponentialRampToValueAtTime(.01,t+.5);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+.5);
  }catch(e){}
}

async function api(caminho, method, body){
  const opts = { method, headers:{'Content-Type':'application/json'} };
  if(body) opts.body = JSON.stringify(body);
  const r = await fetch(FB + caminho, opts);
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return await r.json();
}

function distKm(a,b,c,d){
  const R=6371, tr=x=>x*Math.PI/180;
  const dLa=tr(c-a), dLo=tr(d-b);
  const h=Math.sin(dLa/2)**2 + Math.cos(tr(a))*Math.cos(tr(c))*Math.sin(dLo/2)**2;
  return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
}

async function geocode(end){
  const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(end)+'&limit=1&countrycodes=br');
  const d = await r.json();
  return (d && d.length) ? {lat:parseFloat(d[0].lat), lng:parseFloat(d[0].lon)} : null;
}

async function reverseGeo(lat,lng){
  try{
    const r = await fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lng+'&zoom=17');
    const d = await r.json();
    return d && d.display_name ? d.display_name : null;
  }catch(e){ return null; }
}

function copiarTexto(t){
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t); return; }
  const ta = document.createElement('textarea');
  ta.value = t; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  ta.remove();
}

function crc16(str){
  let crc = 0xFFFF;
  for(let i=0;i<str.length;i++){
    crc ^= str.charCodeAt(i) << 8;
    for(let j=0;j<8;j++){ crc = (crc & 0x8000) ? ((crc<<1)^0x1021)&0xFFFF : (crc<<1)&0xFFFF; }
  }
  return crc.toString(16).toUpperCase().padStart(4,'0');
}
function emv(id, value){ return id + String(value.length).padStart(2,'0') + value; }
function gerarPixCopiaECola(chave, nome, cidade, valor){
  const norm = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9 ]/g,'').trim();
  const nomeN = (norm(nome)||'RECEBEDOR').slice(0,25);
  const cidN  = (norm(cidade)||'BRASIL').slice(0,15);
  const valN  = (parseFloat(valor)||0).toFixed(2);
  const gui   = emv('00','br.gov.bcb.pix') + emv('01', String(chave));
  let payload = emv('00','01') + emv('26',gui) + emv('52','0000') + emv('53','986')
              + (parseFloat(valN)>0 ? emv('54',valN) : '')
              + emv('58','BR') + emv('59',nomeN) + emv('60',cidN)
              + emv('62', emv('05','***'));
  payload += '6304';
  return payload + crc16(payload);
}

// ===================== 🎯 GPS PROFISSIONAL =====================
function obterGPSExato(timeout=15000){
  return new Promise((resolve, reject) => {
    if(!('geolocation' in navigator)){
      reject(new Error('GPS não disponível neste dispositivo'));
      return;
    }
    
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        resolve({
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          precisao: pos.coords.accuracy,
          timestamp: pos.timestamp
        });
      },
      (err) => {
        let msg = 'Erro desconhecido';
        if(err.code === 1) msg = 'Permissão de localização negada. Ative nas configurações do navegador.';
        else if(err.code === 2) msg = 'Localização indisponível. Verifique o GPS do celular.';
        else if(err.code === 3) msg = 'Tempo esgotado ao obter localização. Tente novamente.';
        reject(new Error(msg));
      },
      { 
        enableHighAccuracy: true,
        timeout: timeout,
        maximumAge: 0
      }
    );
  });
}

function iniciarWatchGPS(onUpdate){
  if(watchId !== null) return;
  if(!('geolocation' in navigator)) return;
  
  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      const novaPos = {
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        precisao: pos.coords.accuracy
      };
      gps = novaPos;
      gpsPrecisao = novaPos.precisao;
      if(onUpdate) onUpdate(novaPos);
    },
    (err) => {
      console.warn('Erro no watchPosition:', err.message);
    },
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 5000
    }
  );
}

function pararWatchGPS(){
  if(watchId !== null){
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }
}

async function iniciarComGPS(){
  mostrarTelaCarregamentoGPS(1);
  
  try{
    const posicao = await obterGPSExato(15000);
    gps = { lat: posicao.lat, lng: posicao.lng };
    gpsPrecisao = posicao.precisao;
    
    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="gps-loading">
        <div style="font-size:60px;margin-bottom:20px">✅</div>
        <h2 style="color:#00E676">Localização obtida!</h2>
        <p class="precisao">📍 Precisão: ${Math.round(posicao.precisao)} metros</p>
        <p style="font-size:12px;color:#9CA3AF;margin-top:10px">
          Lat: ${posicao.lat.toFixed(5)}<br/>
          Lng: ${posicao.lng.toFixed(5)}
        </p>
        <p style="font-size:11px;color:#6B7280;margin-top:10px">Abrindo mapa...</p>
      </div>
    `;
    
    iniciarWatchGPS((novaPos) => {
      if(tela === 'home' && map && mkEu){
        mkEu.setLatLng([novaPos.lat, novaPos.lng]);
      }
      if(tela === 'andamento' && map && mkEu){
        mkEu.setLatLng([novaPos.lat, novaPos.lng]);
      }
    });
    
    setTimeout(() => {
      tela = 'home';
      render();
    }, 800);
    
  }catch(err){
    mostrarTelaCarregamentoGPS(2);
    try{
      const posicao = await obterGPSExato(20000);
      gps = { lat: posicao.lat, lng: posicao.lng };
      gpsPrecisao = posicao.precisao;
      iniciarWatchGPS((novaPos) => {
        if(tela === 'home' && map && mkEu){
          mkEu.setLatLng([novaPos.lat, novaPos.lng]);
        }
        if(tela === 'andamento' && map && mkEu){
          mkEu.setLatLng([novaPos.lat, novaPos.lng]);
        }
      });
      setTimeout(() => {
        tela = 'home';
        render();
      }, 500);
    }catch(err2){
      mostrarTelaCarregamentoGPS(3);
      try{
        const posicao = await obterGPSExato(25000);
        gps = { lat: posicao.lat, lng: posicao.lng };
        gpsPrecisao = posicao.precisao;
        iniciarWatchGPS((novaPos) => {
          if(tela === 'home' && map && mkEu){
            mkEu.setLatLng([novaPos.lat, novaPos.lng]);
          }
          if(tela === 'andamento' && map && mkEu){
            mkEu.setLatLng([novaPos.lat, novaPos.lng]);
          }
        });
        setTimeout(() => {
          tela = 'home';
          render();
        }, 500);
      }catch(err3){
        mostrarErroGPS(err3.message || 'Não foi possível obter sua localização após 3 tentativas.');
      }
    }
  }
}

window.criarConta = async () => {
  const nome = (document.getElementById('rgNome').value||'').trim();
  const tel = (document.getElementById('rgTel').value||'').replace(/\D/g,'');
  const senha = document.getElementById('rgSenha').value||'';
  if(!nome){ toast('Informe seu nome.',true); return; }
  if(tel.length < 10){ toast('Telefone inválido (use DDD).',true); return; }
  if(senha.length < 4){ toast('Senha muito curta.',true); return; }
  try{
    const todos = await api('/passageiros.json','GET') || {};
    const jaExiste = Object.values(todos).some(p => p && p.telefone === tel);
    if(jaExiste){ toast('Este telefone já tem conta. Use Entrar.',true); return; }
    const id = 'p' + Date.now();

async function carregarMotoqueirosHome(){
  if(tela !== 'home' || !map || !gps) return;
  try{
    const [motos, posicoes, corridas] = await Promise.all([
      api('/motoqueiros.json','GET'),
      api('/posicoes.json','GET'),
      api('/corridas.json','GET')
    ]);
    
    const M = motos || {};
    const POS = posicoes || {};
    const C = corridas || {};
    
    Object.keys(marcadoresMotosHome).forEach(key => {
      try{ map.removeLayer(marcadoresMotosHome[key]); }catch(e){}
    });
    marcadoresMotosHome = {};
    
    let motosProximos = 0;
    const raioBusca = 5;
    
    Object.entries(M).forEach(([id, m]) => {
      if(!m || m.bloqueado) return;
      
      let ultimaPos = null;
      Object.entries(POS).forEach(([cid, pos]) => {
        const corrida = C[cid];
        if(corrida && corrida.motoqueiroId === id && pos && pos.lat){
          if(!ultimaPos || new Date(pos.ts) > new Date(ultimaPos.ts)) ultimaPos = pos;
        }
      });
      
      if(!ultimaPos || !ultimaPos.lat) return;
      
      const dist = distKm(gps.lat, gps.lng, ultimaPos.lat, ultimaPos.lng);
      if(dist <= raioBusca) motosProximos++;
      
      const key = 'moto-home-'+id;
      const html = '<div style="background:#10B981;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5)">️</div>';
      const mk = L.marker([ultimaPos.lat, ultimaPos.lng], {
        icon: L.divIcon({ html, className:'', iconSize:[32,32], iconAnchor:[16,16] })
      }).addTo(map);
      marcadoresMotosHome[key] = mk;
    });
    
    const el = document.getElementById('contadorMotos');
    if(el){
      if(motosProximos > 0){
        el.className = 'contador-motos tem';
        el.textContent = `🟢 ${motosProximos} motoqueiro(s) a menos de ${raioBusca}km`;
      } else {
        el.className = 'contador-motos sem';
        el.textContent = '🟡 Nenhum motoqueiro próximo no momento';
      }
    }
    
    const bar = document.getElementById('gpsInfoBar');
    if(bar && gps){
      bar.innerHTML = `<span class="coord">📍 ${gps.lat.toFixed(5)}, ${gps.lng.toFixed(5)}</span><span class="prec">±${Math.round(gpsPrecisao||0)}m • ${motosProximos} moto(s)</span>`;
    }
  }catch(e){
    console.error('Erro ao carregar motoqueiros:', e);
  }
}

};

// 🎯 FUNÇÃO PARA ATUALIZAR POSIÇÃO DO MOTOQUEIRO COM ROTAÇÃO E ROTA REAL
// ==========================================
async function atualizarPosicaoMotoqueiro(){
  if(!corridaAtual || !map || !mkMoto) return;
  
  try{
    const pos = await api('/posicoes/'+corridaAtual.id+'.json','GET');
    if(!pos || !pos.lat) return;
    
    const heading = pos.heading !== null && !isNaN(pos.heading) ? pos.heading : 0;
    
    // Atualiza posição do motoqueiro
    mkMoto.setLatLng([pos.lat, pos.lng]);
    
    // Atualiza ícone com rotação
    const iconeHtml = `<div style="font-size:28px; transform: rotate(${heading}deg); transition: transform 0.5s ease; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">➤</div>`;
    mkMoto.setIcon(L.divIcon({
      html: iconeHtml,
      className: '',
      iconSize: [32, 32],
      iconAnchor: [16, 16]
    }));
    
    // Define alvo (origem se estiver indo buscar, destino se estiver em rota)
    const alvo = (corridaAtual.status === 'aceita') 
      ? { lat: corridaAtual.origLat, lng: corridaAtual.origLng } 
      : { lat: corridaAtual.destLat, lng: corridaAtual.destLng };
    
    // Busca rota real nas ruas (OSRM)
    if(linha) map.removeLayer(linha);
    
    try{
      const url = `https://router.project-osrm.org/route/v1/driving/${pos.lng},${pos.lat};${alvo.lng},${alvo.lat}?overview=full&geometries=geojson`;
      const response = await fetch(url);
      const data = await response.json();
      
      if(data.code === 'Ok' && data.routes.length > 0){
        const coordenadasRota = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
        linha = L.polyline(coordenadasRota, { color: '#FFB300', weight: 5, opacity: 0.9 }).addTo(map);
      } else {
        // Fallback: linha reta
        linha = L.polyline([[pos.lat, pos.lng], [alvo.lat, alvo.lng]], { color: '#FFB300', weight: 4, dashArray: '8 8' }).addTo(map);
      }
    } catch(e){
      // Fallback em caso de erro
      if(linha) map.removeLayer(linha);
      linha = L.polyline([[pos.lat, pos.lng], [alvo.lat, alvo.lng]], { color: '#FFB300', weight: 4, dashArray: '8 8' }).addTo(map);
    }
    
    // Ajusta o mapa para mostrar tanto o passageiro quanto o motoqueiro
    const bounds = L.latLngBounds([[gps.lat, gps.lng], [pos.lat, pos.lng]]);
    map.fitBounds(bounds.pad(0.3));
    
  } catch(e){
    console.error('Erro ao atualizar posição do motoqueiro:', e);
  }
}

  const concluida = c && c.status==='concluida';
  const pg = (c && c.pagamento) || {};
  const pgTxt = pg.status==='pago' ? 'PIX pago ✅' : pg.metodo==='dinheiro' ? 'Dinheiro' : pg.status==='pix_informado' ? 'PIX informado' : '—';
  app.innerHTML = `
    <div class="wrap">
    <div class="card state">
      <div class="big">${concluida?'✅':'❌'}</div>
      <b style="font-size:17px;color:#E6EDF3">${concluida?'Corrida concluída!':'Corrida encerrada'}</b>
      <p style="margin-top:6px">${concluida?'Obrigado por usar o VAI DE MOTO.':'Não foi possível concluir.'}</p>
    </div>
    ${c?`<div class="card">
      <div class="rowval"><span class="k">Motoqueiro</span><span class="v">${esc(c.motoqueiroNome||'—')}</span></div>
      <div class="rowval"><span class="k">Valor</span><span class="v" style="color:#00E676">${brl(c.valorAceito)}</span></div>
      <div class="rowval"><span class="k">Pagamento</span><span class="v">${pgTxt}</span></div>
    </div>`:''}
    <button class="btn amber" onclick="novaCorrida()">🏍️ PEDIR NOVA CORRIDA</button>
    </div>
  `;
}

window.novaCorrida = () => { 
  corridaAtual=null; 
  destinoTexto=''; 
  motoDados=null; 
  lastPgStatus='';
  mapaCorridaInicializado = false;
  if(motoWatchInterval) { clearInterval(motoWatchInterval); motoWatchInterval = null; }
  tela='home'; 
  render(); 
};

window.abrirPerfil = async () => {
  if(!sessao) return;
  try{
    const p = await api('/passageiros/'+sessao.id+'.json','GET');
    if(!p){ toast('Conta não encontrada.',true); return; }
    perfilDados = p;
    tela='perfil';
    render();
  }catch(e){ toast('Erro: '+e.message,true); }
};

function renderPerfil(app){
  const d = perfilDados || {};
  app.innerHTML = `
    <div class="wrap">
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <div style="width:44px;height:44px;border-radius:50%;background:rgba(0,230,118,.12);border:2px solid rgba(0,230,118,.35);display:flex;align-items:center;justify-content:center;font-size:20px">🙋</div>
        <div><b style="font-size:15px">Meus dados</b><p style="font-size:11px;color:#8B98A5;margin:0">Edite e salve</p></div>
      </div>
      <div class="lbl">Nome</div><input class="inp" id="pfNome" value="${esc(d.nome||'')}" style="margin-bottom:10px"/>
      <div class="lbl">Telefone</div><input class="inp" id="pfTel" type="tel" value="${esc(d.telefone||'')}" style="margin-bottom:10px"/>
      <div class="lbl">Nova senha (vazio = manter)</div><input class="inp" id="pfSenha" type="password" placeholder="••••••" style="margin-bottom:14px"/>
      <button class="btn green" onclick="salvarPerfil()">💾 Salvar</button>
      <button class="btn ghost" style="margin-top:8px" onclick="voltarHome()">← Voltar</button>
    </div>
    </div>
  `;
}

window.voltarHome = () => { tela='home'; render(); };

window.salvarPerfil = async () => {
  if(!sessao || !perfilDados) return;
  const nome = (document.getElementById('pfNome').value||'').trim();
  const tel = (document.getElementById('pfTel').value||'').replace(/\D/g,'');
  const senhaNova = document.getElementById('pfSenha').value||'';
  if(!nome){ toast('Informe seu nome.',true); return; }
  if(tel.length < 10){ toast('Telefone inválido.',true); return; }
  if(senhaNova && senhaNova.length < 4){ toast('Senha curta.',true); return; }
  try{
    const todos = await api('/passageiros.json','GET') || {};
    if(Object.values(todos).some(p => p && p.telefone === tel && p.id !== sessao.id)){ toast('Telefone em uso.',true); return; }
    const patch = { nome, telefone:tel };
    if(senhaNova) patch.senhaHash = hash(senhaNova);
    await api('/passageiros/'+sessao.id+'.json','PATCH', patch);
    salvarSessao(Object.assign({}, sessao, { nome, telefone:tel }));
    perfilDados = Object.assign({}, perfilDados, patch);
    beep();
    toast('✅ Dados atualizados!');
    tela='home'; render();
  }catch(e){ toast('Erro: '+e.message,true); }
};

function iniciarPolling(){
  pararPolling();
  pollTimer = setInterval(tick, window.VDM.pollMs || 4000);
  tick();
}
function pararPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }

async function tick(){
  if(!corridaAtual) return;
  try{
    const c = await api('/corridas/'+corridaAtual.id+'.json','GET');
    if(!c){ corridaAtual=null; tela='home'; render(); return; }

    const limiteMs = TEMPO_LIMITE_MIN * 60000;
    const idade = Date.now() - new Date(c.criadaEm||0).getTime();
    if(c.status === 'aberta' && idade > limiteMs){
      await api('/corridas/'+c.id+'.json','DELETE');
      corridaAtual = null;
      toast('⏰ Nenhum motoqueiro aceitou em '+TEMPO_LIMITE_MIN+' min. Tente novamente.');
      tela='home'; render();
      return;
    }

    if(tela==='ofertas'){
      if(c.status==='aceita' || c.status==='em_rota'){
        corridaAtual = c;
        lastPgStatus = (c.pagamento && c.pagamento.status) || 'pendente';
        beep(); toast('✅ Oferta aceita!');
        tela='andamento'; render(); iniciarPolling(); return;
      }
      if(c.status==='cancelada'){ toast('Corrida cancelada.',true); corridaAtual=null; tela='home'; render(); return; }
      const ofs = c.ofertas ? Object.entries(c.ofertas).map(([mid,o])=>({mid,...o})) : [];
      ofs.sort((a,b)=>(parseFloat(a.valor)||0)-(parseFloat(b.valor)||0));
      const lista = document.getElementById('listaOfertas');
      if(lista){
        const restante = Math.max(0, Math.ceil((limiteMs - idade)/1000));
        const mm = Math.floor(restante/60), ss = restante%60;
        const contador = `<div class="timer"> Expira em <b>${mm}:${String(ss).padStart(2,'0')}</b></div>`;
        if(ofs.length===0){
          lista.innerHTML = contador + '<div class="state"><div class="big">⏳</div>Aguardando ofertas...</div>';
        } else {
          lista.innerHTML = contador + ofs.map(o=>`
            <div class="oferta">
              <div class="info">
                <div class="nome">🏍️ ${esc(o.nome||'Motoqueiro')}</div>
                <div class="moto">${esc([o.modelo,o.cor,o.placa].filter(Boolean).join(' • '))}</div>
              </div>
              <div class="valor">${brl(o.valor)}</div>
              <button class="btn green" onclick="aceitarOferta('${esc(o.mid)}', ${parseFloat(o.valor)||0})">Aceitar</button>
            </div>
          `).join('');
          ofs.forEach(o=>{ if(!ofertasVistas[o.mid]){ ofertasVistas[o.mid]=true; beep(); } });
        }
      }
    }

    if(tela==='andamento'){
      const prevStatus = corridaAtual.status;
      const prevPg = (corridaAtual.pagamento && corridaAtual.pagamento.status) || 'pendente';
      corridaAtual = c;
      const stPg = (c.pagamento && c.pagamento.status) || 'pendente';
      if(c.status==='concluida'){ beep(); tela='fim'; render(); return; }
      if(c.status==='cancelada'){ toast('Corrida cancelada.',true); tela='fim'; render(); return; }
      if(c.status!==prevStatus || stPg!==prevPg){
        if(stPg==='pago' && prevPg!=='pago'){ beep(); toast('💰 Pagamento confirmado!'); }
        render(); iniciarPolling(); return;
      }
      const st = document.getElementById('stBox');
      if(st){
        if(c.status==='aceita'){ st.style.color='#3B82F6'; st.style.background='rgba(59,130,246,.08)'; st.style.borderColor='rgba(59,130,246,.4)'; st.textContent='🏍️ '+ (c.motoqueiroNome||'Motoqueiro') +' a caminho...'; }
        if(c.status==='em_rota'){ st.style.color='#00E676'; st.style.background='rgba(0,230,118,.08)'; st.style.borderColor='rgba(0,230,118,.4)'; st.textContent='🛵 Em corrida para o destino...'; }
      }
    }
  }catch(e){}
}

window.aceitarOferta = async (mid, valor) => {
  if(!corridaAtual) return;
  if(!confirm('Aceitar '+brl(valor)+'?')) return;
  try{
    const m = await api('/motoqueiros/'+mid+'.json','GET');
    await api('/corridas/'+corridaAtual.id+'.json','PATCH',{
      status:'aceita',
      motoqueiroId: mid,
      motoqueiroNome: (m && m.nome) || 'Motoqueiro',
      valorAceito: valor,
      pagamento: { metodo:null, status:'pendente' },
      aceitaEm: new Date().toISOString()
    });
    beep();
    toast('✅ Oferta aceita! Escolha o pagamento.');
  }catch(e){ toast('Erro: '+e.message,true); }
};

function limparMapa(){
  if(map){ try{ map.remove(); }catch(e){} map=null; }
  mkEu=mkMoto=mkDest=null; linha=null;
  marcadoresMotosHome = {};
}

// ===================== 🎯 INICIALIZAÇÃO PRINCIPAL =====================
(function init(){
  const s = carregarSessao();
  if(s){
    sessao = s;
    iniciarComGPS();
  } else {
    render();
  }
})();
</script>
